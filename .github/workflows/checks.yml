name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Design tokens (trim-ui → Enforcement)
        run: node scripts/check-design-tokens.mjs
      - name: Device logic (PLAN §10)
        run: npx tsx scripts/check-device-logic.ts
      - name: Receipt, History and moments logic (PLAN Phase 5)
        run: npx tsx scripts/check-receipt-logic.ts
      - name: Progress logic
        run: npx tsx scripts/check-progress-logic.ts
