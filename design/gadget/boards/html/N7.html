<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Finishes</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.grid{background-color:#0E0E0D;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
.dev{position:absolute;border-radius:44px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 10px rgba(0,0,0,.18),0 30px 50px rgba(0,0,0,.6)}
.d-disp{position:absolute;left:16px;right:16px;top:64px;height:200px;border-radius:20px;background:#121211;box-shadow:inset 0 3px 8px rgba(0,0,0,.9);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;padding:16px;box-sizing:border-box}
.d-key{position:absolute;width:34px;height:34px;border-radius:17px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.d-roll{position:absolute;left:66px;right:66px;top:16px;height:38px;border-radius:12px;background:repeating-linear-gradient(90deg,#F2F1ED 0 4px,#C4C1B9 4px 6px);box-shadow:inset 10px 0 10px rgba(0,0,0,.22),inset -10px 0 10px rgba(0,0,0,.22),0 3px 0 rgba(0,0,0,.25)}
.d-shut{position:absolute;left:50%;bottom:24px;margin-left:-44px;width:88px;height:88px;border-radius:44px;background:radial-gradient(ellipse at 50% 22%,#FF8A45,#F2550F 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 #B83A05}
.d-jog{position:absolute;right:18px;bottom:22px;width:36px;height:100px;border-radius:14px;background:repeating-linear-gradient(180deg,#F2F1ED 0 4px,#C4C1B9 4px 6px);box-shadow:inset 0 10px 10px rgba(0,0,0,.22),inset 0 -10px 10px rgba(0,0,0,.22),0 3px 0 rgba(0,0,0,.25)}
.d-flip{position:absolute;left:22px;bottom:50px;width:36px;height:44px;border-radius:8px;background:#1C1B18;color:#F3F2EE;font-family:'Doto',monospace;font-weight:900;font-size:22px;line-height:44px;text-align:center}
.sw{position:absolute;top:0;width:112px;height:92px;border-radius:20px;padding:12px 14px;box-sizing:border-box;font-family:'Doto',monospace;font-weight:900}
.sw b{display:block;font-size:22px}
.sw span{display:block;font-family:ui-rounded,-apple-system,sans-serif;font-size:13px;font-weight:700;margin-top:2px}
.tab{font-size:22px;font-weight:800;color:#5E5C57}
.cb{position:absolute;bottom:40px;width:56px;height:56px;border-radius:28px;background:#262624;display:flex;align-items:center;justify-content:center;color:#E4E2DC;font-size:20px;font-weight:800}
.lock{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:11px;background:#FF6A1A;color:#1C0E05;font-size:11px;line-height:22px;text-align:center;font-family:ui-rounded,sans-serif;font-weight:900}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
</style>
</head><body style="margin:0">
<div class="grid" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #F3F2EE; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; left: 24px; right: 24px; top: 60px; height: 56px; border-radius: 22px; background: #1C1C1A; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800">Finish 305, Signal</div>
<div style="position: absolute; left: 75px; top: 150px; width: 240px; height: 430px; animation: bob 4s ease-in-out infinite">
<div class="dev" style="inset: 0; background-image: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 40%), linear-gradient(180deg, #FF7A35, #E04A0C)">
<div class="d-key" style="left: 18px; top: 18px"></div><div class="d-roll"></div><div class="d-key" style="right: 18px; top: 18px"></div>
<div class="d-disp"><div style="font-size: 12px; color: #7A3E1C">THU</div><div style="font-size: 30px; margin-top: 6px">PUSH 1</div><div style="font-size: 11px; line-height: 18px; margin-top: 10px; color: #7A3E1C">BENCH 3×8<br>CABLE FLY 3×12<br>OHP 3×8</div></div>
<div class="d-flip">2</div><div class="d-shut" style="background: radial-gradient(ellipse at 50% 22%, #F4F3EF, #D2CEC6); box-shadow: inset 0 2px 0 #fff, 0 5px 0 #A33A0A"></div><div class="d-jog"></div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 612px; display: flex; gap: 22px; justify-content: center; align-items: center"><span class="tab">Display</span><span class="tab" style="color: #F3F2EE">Body</span><span class="tab">Keys</span></div>
<div style="position: absolute; left: -40px; top: 656px; width: 640px; height: 100px">
<div class="sw" style="left: 0; background: linear-gradient(180deg, #E4E2DC, #CFCBC3); color: #1C1B18"><b>212</b><span style="color: #6E6B64">Aluminium</span></div>
<div class="sw" style="left: 124px; background: linear-gradient(180deg, #3A3936, #22211F); color: #F3F2EE"><b>101</b><span style="color: #8C8A84">Graphite</span></div>
<div class="sw" style="left: 248px; background: linear-gradient(180deg, #FF7A35, #E04A0C); color: #fff; transform: rotate(-5deg) translateY(-6px); box-shadow: 0 0 0 3px #fff, 0 12px 20px rgba(0,0,0,.5)"><b>305</b><span>Signal</span></div>
<div class="sw" style="left: 372px; background: linear-gradient(180deg, #EFE6D3, #D9CBB0); color: #3A3326"><b>408</b><span style="color: #7A6F5C">Bone</span><i class="lock">+</i></div>
<div class="sw" style="left: 496px; background: linear-gradient(135deg, #7FD3E8, #C59BFF 50%, #FF9AB5); color: #1C1B18"><b>8106</b><span>Prismatic</span><i class="lock">+</i></div>
</div>
<button class="cb" style="left: 24px">✕</button>
<button style="position: absolute; left: 96px; right: 96px; bottom: 40px; height: 56px; border-radius: 28px; background: #2E2D2A; color: #F3F2EE; font-size: 18px; font-weight: 800">Done</button>
<button class="cb" style="right: 24px"><svg width="20" height="22" viewBox="0 0 20 22"><path d="M10 14 V2 M5 7 L10 2 L15 7 M3 11 V19 H17 V11" fill="none" stroke="#E4E2DC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
</body></html>
