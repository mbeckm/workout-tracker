<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>P4 Generate (Pro): three knobs</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.2px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);text-align:center}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.knob{border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 2deg,#E4E0D7 2deg 4deg);box-shadow:0 6px 0 #A9A69E,0 14px 24px rgba(0,0,0,.2);position:relative;width:100px;height:100px;margin:0 auto}
.cap{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FAF9F6,#D9D6CF);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.15)}
.ptr{position:absolute;left:50%;top:6px;width:5px;height:20px;margin-left:-2.5px;border-radius:3px;background:#FF6A1A}
.col{width:112px;display:flex;flex-direction:column;gap:10px}
.opt{font-size:12px;font-weight:800;color:#A9A69E;text-align:center;line-height:18px}
.opt b{color:#C2410C}
.pro{display:inline-flex;height:24px;padding:0 10px;border-radius:12px;background:#2A2925;color:#FF8A45;font-size:12px;font-weight:800;align-items:center;letter-spacing:1px}
.ln{font-size:15px;line-height:23px}
@keyframes type{from{width:0}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 800; color: #7C7A73">Build it for me</span><span class="pro">PRO</span></div>
<div style="font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.5px">Set three dials</div>
</div>
<div class="disp" style="top: 146px; left: 16px; right: 16px; height: 260px; padding: 16px 18px; box-sizing: border-box">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 14px"><span>STRENGTH  4 DAYS  GYM</span><span>24 LIFTS</span></div>
<div style="font-size: 30px; margin-top: 8px">UPPER LOWER</div>
<div style="margin-top: 12px; overflow: hidden; white-space: nowrap; animation: type 1.4s steps(30)">
<div class="ln">MON UPPER A<span class="dim">  BENCH ROW OHP</span></div>
<div class="ln">TUE LOWER A<span class="dim">  SQUAT RDL CALF</span></div>
<div class="ln">THU UPPER B<span class="dim">  INCL PULLUP DIP</span></div>
<div class="ln">SAT LOWER B<span class="dim">  DEAD LUNGE LEG</span></div>
</div>
<div class="dim" style="position: absolute; left: 18px; bottom: 14px; font-size: 14px">5 TO 6 REPS, 3 SETS, ~60 MIN</div>
</div>
<div style="position: absolute; top: 432px; left: 10px; right: 10px; display: flex; justify-content: space-between">
<div class="col"><div class="lab">GOAL</div><div class="knob"><div class="cap" style="transform: rotate(-45deg)"><div class="ptr"></div></div></div><div class="opt"><b>STRENGTH</b><br>SIZE<br>FITNESS</div></div>
<div class="col"><div class="lab">DAYS</div><div class="knob"><div class="cap" style="transform: rotate(0deg)"><div class="ptr"></div></div></div><div class="opt">2  3  <b>4</b>  5  6</div></div>
<div class="col"><div class="lab">KIT</div><div class="knob"><div class="cap" style="transform: rotate(-60deg)"><div class="ptr"></div></div></div><div class="opt"><b>FULL GYM</b><br>DUMBBELLS<br>BODYWEIGHT</div></div>
</div>
<button class="go" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 84px; font-size: 22px">Use this plan</button>
</div>
</body></html>
