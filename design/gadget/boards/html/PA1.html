<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PA1 A: plan as a sheet</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}button{font:inherit;color:inherit;border:0;background:none;padding:0}.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}.rk{position:absolute;width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.1)}.rock{position:absolute;left:96px;top:56px;width:198px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E}.scrim{position:absolute;inset:0;background:rgba(20,18,15,.4)}.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;box-shadow:0 -10px 30px rgba(0,0,0,.35);overflow:hidden}.st{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:18px;font-weight:800}.ck{position:absolute;top:14px;height:40px;min-width:40px;padding:0 14px;box-sizing:border-box;border-radius:20px;background:#262624;display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:16px;font-weight:800}.dc{position:absolute;left:12px;right:12px;background:#232321;border-radius:24px;overflow:hidden}.sm{color:#8C8A84}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #2E2E2B;font-size:16px;font-weight:700}.row:first-child{border-top:0}.num{font-family:'Doto',monospace;font-weight:900;color:#FF6A1A;background:#121211;border-radius:10px;padding:5px 10px;font-size:15px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.dh{position:absolute;left:28px;right:24px;display:flex;justify-content:space-between;align-items:center}
.dh b{font-size:20px;font-weight:800}
.dh span{color:#8C8A84;font-size:20px;font-weight:800}
.add{color:#FF6A1A}
.act{display:inline-flex;height:24px;align-items:center;padding:0 10px;border-radius:12px;background:#33322F;color:#C9C6BF;font-size:12px;font-weight:800;margin-left:8px;vertical-align:4px}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div class="rk" style="left: 20px; top: 56px"></div><div class="rock"></div><div class="rk" style="right: 20px; top: 56px"></div>
<div class="scrim"></div>
<div class="sheet" style="top: 96px">
<button class="ck" style="left: 16px">‹</button>
<div class="st">Plan</div>
<button class="ck" style="right: 16px">…</button>
<div style="position: absolute; left: 28px; right: 28px; top: 74px"><span style="font-size: 28px; font-weight: 800; letter-spacing: -.5px">Push Pull Legs</span><span class="act">Active</span></div>
<div class="dh" style="top: 128px"><b>Pull 1</b><span>…</span></div>
<div class="dc" style="top: 160px">
<div class="row"><span>Deadlift</span><span class="num">3 × 5</span></div>
<div class="row"><span>Pull-up</span><span class="num">3 × 8</span></div>
<div class="row"><span>Barbell Row</span><span class="num">3 × 8</span></div>
<div class="row add"><span>Add lift</span><span>+</span></div>
</div>
<div class="dh" style="top: 380px"><b>Push 1</b><span>…</span></div>
<div class="dc" style="top: 412px">
<div class="row"><span>Bench Press</span><span class="num">3 × 8</span></div>
<div class="row"><span>Cable Fly</span><span class="num" style="box-shadow: inset 0 0 0 2px #FF6A1A">3 × 12</span></div>
<div class="row"><span>Overhead Press</span><span class="num">3 × 8</span></div>
<div class="row add"><span>Add lift</span><span>+</span></div>
</div>
<div class="dh" style="top: 632px"><b>Legs 1</b><span>…</span></div>
<div class="dc" style="top: 664px">
<div class="row"><span>Squat</span><span class="num">3 × 6</span></div>
</div>
</div>
</div>
</body></html>
