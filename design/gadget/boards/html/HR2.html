<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>HR2 Receipt spike</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;overflow:hidden}
.st{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:18px;font-weight:800}
.ck{position:absolute;top:14px;width:40px;height:40px;border-radius:20px;background:#262624;display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:18px;font-weight:800}
.r{position:absolute;left:50%;width:220px;margin-left:-110px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.r .p{font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:18px;color:#3A3833;padding:30px 18px 22px;background:linear-gradient(180deg,#FCFAF4,#EFEADF);-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/12px 8px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/12px 8px repeat-x}
.r b{display:block;font-size:14px;color:#1C1B18}
.r hr{border:0;border-top:1px dashed #B9B6AE;margin:8px 0}
.row{display:flex;justify-content:space-between}
.hole{position:absolute;left:50%;top:12px;margin-left:-5px;width:10px;height:10px;border-radius:5px;background:#151514;z-index:2}
.spike{position:absolute;left:50%;margin-left:-3px;top:150px;width:6px;height:470px;background:linear-gradient(90deg,#8E8A80,#F4F3EF,#8E8A80);border-radius:3px 3px 0 0;z-index:0}
.base{position:absolute;left:50%;margin-left:-70px;top:610px;width:140px;height:30px;border-radius:15px;background:linear-gradient(180deg,#ECEAE4,#B9B5AC);box-shadow:0 8px 0 #6E6B64,0 18px 30px rgba(0,0,0,.5)}
.count{position:absolute;left:0;right:0;top:668px;text-align:center}
@keyframes drop{from{transform:translateY(-60px) rotate(-3deg);opacity:0}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; inset: 0; background: rgba(20,18,15,.4)"></div>
<div class="sheet" style="top: 96px">
<button class="ck" style="left: 16px">‹</button>
<div class="st">History</div>
<div class="spike"></div>
<div class="r" style="top: 330px; transform: rotate(-7deg)"><i class="hole"></i><div class="p" style="height: 220px"></div></div>
<div class="r" style="top: 310px; transform: rotate(5deg)"><i class="hole"></i><div class="p" style="height: 230px"></div></div>
<div class="r" style="top: 290px; transform: rotate(-3deg)"><i class="hole"></i><div class="p" style="height: 240px"></div></div>
<div class="r" style="top: 130px; transform: rotate(2deg); animation: drop .6s cubic-bezier(.2,.9,.3,1)"><i class="hole"></i><div class="p"><b>PUSH 1</b>THU 2 OCT  44 MIN<hr><div class="row"><span>BENCH PRESS</span><span>3</span></div><div class="row" style="color: #8E8B83"><span>&nbsp;87.5 × 8, 8, 7</span></div><div class="row"><span>CABLE FLY</span><span>3</span></div><div class="row"><span>OVERHEAD PRESS</span><span>3</span></div><hr><div class="row" style="font-weight: 700"><span>VOLUME</span><span>4,530 KG</span></div><div class="row" style="font-weight: 700; color: #C2410C"><span>BENCH PR</span><span>87.5</span></div></div></div>
<div class="base"></div>
<div class="count"><div style="font-size: 26px; font-weight: 800">38 workouts</div><div style="margin-top: 4px; font-size: 15px; font-weight: 600; color: #8C8A84">Since 4 July</div></div>
</div>
</div>
</body></html>
