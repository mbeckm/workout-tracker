<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G5 Rest: the wheel sets time</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.key{border-radius:18px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.08);font-weight:800;color:#2A2925}
.jog{border-radius:30px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 14px 16px rgba(0,0,0,.2),inset 0 -14px 16px rgba(0,0,0,.2),0 3px 0 #A9A69E;position:relative}
.led{width:30px;height:6px;border-radius:3px;background:#3A2214}
.on{background:#FF6A1A;box-shadow:0 0 8px #FF6A1A}
.tag{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:800;color:#7C7A73}
@keyframes ring{from{stroke-dashoffset:0}to{stroke-dashoffset:540}}
@keyframes roll{from{background-position:0 0}to{background-position:0 28px}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div class="disp" style="position: absolute; top: 56px; left: 16px; right: 16px; height: 150px; padding: 18px 20px; box-sizing: border-box">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 15px"><span>UP NEXT</span><span>12:06</span></div>
<div style="margin-top: 12px; font-size: 30px">BENCH PRESS</div>
<div style="margin-top: 10px; display: flex; align-items: center; gap: 6px"><span class="led on"></span><span class="led on"></span><span class="led" style="box-shadow: inset 0 0 0 1px #FF6A1A"></span><span style="margin-left: 8px; font-size: 16px">SET 3  85×8</span></div>
</div>
<div style="position: absolute; top: 224px; left: 20px; right: 20px; display: flex; justify-content: space-between"><span class="lab">REST</span><span class="lab">MIN</span></div>
<div style="position: absolute; top: 246px; left: 16px; right: 16px; display: flex; gap: 10px">
<div class="disp" style="flex-grow: 1; height: 360px; display: flex; align-items: center; justify-content: center">
<svg width="220" height="220" viewBox="0 0 220 220" style="position: absolute">
<circle cx="110" cy="110" r="86" fill="none" stroke="#3A2214" stroke-width="10" stroke-dasharray="3 6"></circle>
<circle cx="110" cy="110" r="86" fill="none" stroke="#FF6A1A" stroke-width="10" stroke-dasharray="540" transform="rotate(-90 110 110)" style="animation: ring 90s linear infinite; filter: drop-shadow(0 0 6px #FF6A1A)"></circle>
</svg>
<div style="text-align: center; position: relative"><div style="font-size: 64px; line-height: 64px">1:24</div><div class="dim" style="font-size: 15px; margin-top: 8px">OF 2:00</div></div>
</div>
<div class="jog" style="width: 68px; height: 360px; animation: roll 1.6s ease-in-out infinite alternate"><span class="tag" style="top: 14px">+15</span><span class="tag" style="bottom: 14px">−15</span></div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 10px">
<button class="key" style="flex-grow: 1; height: 84px; font-size: 18px">Skip rest</button>
<button class="key" style="width: 120px; height: 84px; font-size: 18px">Edit set 2</button>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 140px; display: flex; gap: 8px; align-items: center; justify-content: center">
<span class="lab">SET 2 LOGGED  85 × 8</span>
</div>
</div>
</body></html>
