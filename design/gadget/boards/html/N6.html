<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Plan sheet</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.rk{position:absolute;width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E}
.roller{position:absolute;border-radius:18px;background:repeating-linear-gradient(90deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 18px 0 16px rgba(0,0,0,.22),inset -18px 0 16px rgba(0,0,0,.22),0 3px 0 #A9A69E}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;box-shadow:0 -10px 30px rgba(0,0,0,.35);overflow:hidden}
.st{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:18px;font-weight:800}
.ck{position:absolute;top:14px;height:40px;min-width:40px;padding:0 14px;box-sizing:border-box;border-radius:20px;background:#262624;display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:16px;font-weight:800}
.dc{background:#232321;border-radius:24px;box-sizing:border-box}
.sm{color:#8C8A84}
.sec{font-family:'Doto',monospace;font-weight:900;font-size:13px;letter-spacing:1px;color:#6E6C66}
.cart{position:absolute;width:62px;height:84px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#ECEAE4,#C9C5BC);box-shadow:inset 0 2px 0 #fff,0 6px 0 #6E6B64,0 14px 20px rgba(0,0,0,.45)}
.cart i{position:absolute;left:8px;right:8px;top:10px;height:34px;border-radius:6px;background:#121211}
.cart b{position:absolute;left:8px;right:8px;top:16px;text-align:center;font-family:'Doto',monospace;font-weight:900;font-size:13px;color:#FF6A1A}
.cart u{position:absolute;left:14px;right:14px;bottom:10px;height:14px;border-radius:3px;background:repeating-linear-gradient(90deg,#B9B4AA 0 3px,transparent 3px 6px)}
.day{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-top:1px solid #2E2E2B}
.day:first-child{border-top:0}
.day b{display:block;font-size:18px;font-weight:800}
.day span{display:block;font-size:14px;font-weight:600;color:#8C8A84;margin-top:3px}
.nx{display:inline-flex;height:26px;align-items:center;padding:0 10px;border-radius:13px;background:#FF6A1A;color:#1C0E05;font-size:13px;font-weight:800}
.done{display:inline-flex;height:26px;align-items:center;padding:0 10px;border-radius:13px;background:#33322F;color:#8C8A84;font-size:13px;font-weight:800}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div class="rk" style="left: 20px; top: 56px"></div><div class="roller" style="left: 100px; top: 52px; width: 190px; height: 64px"></div><div class="rk" style="right: 20px; top: 56px"></div>
<div style="position: absolute; inset: 0; background: rgba(20,18,15,.35)"></div>
<div class="sheet" style="top: 96px">
<button class="ck" style="left: 16px">‹</button>
<div class="st">Plan</div>
<button class="ck" style="right: 16px">Edit</button>
<div style="position: absolute; left: 0; right: 0; top: 76px; height: 110px">
<div class="cart" style="left: 70px; top: 14px; transform: rotate(-8deg)"><i></i><b>UA</b><u></u></div>
<div class="cart" style="left: 130px; top: 4px; transform: rotate(-2deg)"><i></i><b>LA</b><u></u></div>
<div class="cart" style="left: 194px; top: 4px; transform: rotate(3deg)"><i></i><b>UB</b><u></u></div>
<div class="cart" style="left: 256px; top: 14px; transform: rotate(9deg)"><i></i><b>LB</b><u></u></div>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 202px; text-align: center"><div style="font-size: 26px; line-height: 30px; font-weight: 800; letter-spacing: -.4px">Upper Lower</div><div class="sm" style="margin-top: 4px; font-size: 15px; font-weight: 600">4 days a week, since August</div></div>
<div class="sec" style="position: absolute; left: 28px; top: 280px">THIS WEEK</div>
<div class="dc" style="position: absolute; left: 12px; right: 12px; top: 304px">
<div class="day"><div><b>Upper A</b><span>Bench Press, Barbell Row, Overhead Press</span></div><span class="done">Done</span></div>
<div class="day"><div><b>Lower A</b><span>Squat, Romanian Deadlift, Leg Curl</span></div><span class="done">Done</span></div>
<div class="day"><div><b>Upper B</b><span>Incline Press, Pull-up, Dips</span></div><span class="nx">Next</span></div>
<div class="day"><div><b>Lower B</b><span>Deadlift, Lunge, Leg Press</span></div><span class="sm" style="font-size: 20px">›</span></div>
</div>
<div class="sec" style="position: absolute; left: 28px; top: 640px">OTHER PLANS</div>
<div class="dc" style="position: absolute; left: 12px; right: 12px; top: 664px; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 17px; font-weight: 800"><span>New plan</span><span style="font-size: 22px; color: #FF6A1A">+</span></div>
</div>
</div>
</body></html>
