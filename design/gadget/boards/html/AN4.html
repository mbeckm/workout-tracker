<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A4 Two knobs, compare</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:20px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden;padding:12px 14px;box-sizing:border-box}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);position:absolute}
.card{background:#FBFAF7;border-radius:28px;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(60,50,30,.12),0 1px 2px rgba(60,50,30,.1)}
.mut{color:#8E8B83}
.dock{border-radius:40px 40px 0 0;box-shadow:0 -1px 0 #fff,0 -12px 30px rgba(60,50,30,.16)}
.knob{border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 2deg,#E4E0D7 2deg 4deg);box-shadow:0 6px 0 #A9A69E,0 14px 24px rgba(0,0,0,.2);position:absolute}
.cap{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FAF9F6,#D9D6CF);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.15)}
.ptr{position:absolute;left:50%;top:6px;width:5px;height:22px;margin-left:-2.5px;border-radius:3px}
.leg{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800}
.leg i{width:14px;height:4px;border-radius:2px}
</style>
</head><body style="margin:0">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F2EE; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px">
<div class="mut" style="font-size: 15px; font-weight: 800">Compare</div>
<div style="font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.5px">Bench is 1.6× your OHP</div>
</div>
<div class="card" style="position: absolute; top: 148px; left: 16px; right: 16px; height: 330px; padding: 20px; box-sizing: border-box">
<div style="display: flex; gap: 16px"><span class="leg"><i style="background: #F2550F"></i>Bench Press</span><span class="leg"><i style="background: #2A2925"></i>Overhead Press</span></div>
<svg width="318" height="200" viewBox="0 0 318 200" style="position: absolute; left: 20px; top: 56px">
<line x1="0" y1="40" x2="318" y2="40" stroke="#ECEAE4"></line><line x1="0" y1="100" x2="318" y2="100" stroke="#ECEAE4"></line><line x1="0" y1="160" x2="318" y2="160" stroke="#ECEAE4"></line>
<path d="M0 70 L53 66 L106 60 L159 54 L212 44 L265 36 L318 26" fill="none" stroke="#F2550F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M0 150 L53 148 L106 149 L159 144 L212 142 L265 141 L318 138" fill="none" stroke="#2A2925" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
<line x1="318" y1="30" x2="318" y2="134" stroke="#B9B6AE" stroke-width="2" stroke-dasharray="3 4"></line>
</svg>
<div style="position: absolute; left: 20px; right: 20px; bottom: 18px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 800" class="mut"><span>Gap 8 weeks ago 30 kg</span><span style="color: #C2410C">Now 34.5 kg</span></div>
</div>
<div class="alu dock" style="position: absolute; left: 0; right: 0; bottom: 0; height: 330px">
<span class="lab" style="left: 24px; top: 24px">LIFT A</span><span class="lab" style="left: 210px; top: 24px">LIFT B</span>
<div class="disp" style="left: 16px; top: 44px; width: 170px; height: 84px"><div class="dim" style="font-size: 13px">BENCH PRESS</div><div style="font-size: 34px; margin-top: 6px">92.5</div></div>
<div class="disp" style="left: 204px; top: 44px; width: 170px; height: 84px; color: #FFB48A"><div class="dim" style="font-size: 13px">OVERHEAD PRS</div><div style="font-size: 34px; margin-top: 6px">58.0</div></div>
<div class="knob" style="left: 41px; top: 152px; width: 120px; height: 120px"><div class="cap" style="transform: rotate(-30deg)"><div class="ptr" style="background: #FF6A1A"></div></div></div>
<div class="knob" style="left: 229px; top: 152px; width: 120px; height: 120px"><div class="cap" style="transform: rotate(70deg)"><div class="ptr" style="background: #2A2925"></div></div></div>
</div>
</div>
</body></html>
