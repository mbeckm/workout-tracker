<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PB3 B: plans as a rack</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}button{font:inherit;color:inherit;border:0;background:none;padding:0}.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),linear-gradient(180deg,#E4E2DC,#D2CFC8)}.scrim{position:absolute;inset:0;background:rgba(20,18,15,.4)}.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;overflow:hidden}.st{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:18px;font-weight:800}.ck{position:absolute;top:14px;height:40px;min-width:40px;padding:0 14px;box-sizing:border-box;border-radius:20px;background:#262624;display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:16px;font-weight:800}
.shelf{position:absolute;left:16px;right:16px;height:150px;border-radius:24px;background:#1C1C1A;padding:14px 18px;box-sizing:border-box}
.shelf.on{box-shadow:inset 0 0 0 3px #FF6A1A}
.shelf b{font-size:19px;font-weight:800}
.shelf .s{font-size:13px;font-weight:600;color:#8C8A84;margin-top:2px}
.carts{position:absolute;left:18px;bottom:0;display:flex;gap:8px;align-items:flex-end}
.cart{width:48px;height:64px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#ECEAE4,#C9C5BC);box-shadow:inset 0 2px 0 #fff;position:relative}
.cart i{position:absolute;left:6px;right:6px;top:8px;height:24px;border-radius:4px;background:#121211;color:#FF6A1A;font:900 9px/24px 'Doto',monospace;text-align:center;font-style:normal}
.cart.d i{color:#5DAA68}
.act{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:11px;background:#FF6A1A;color:#1C0E05;font-size:11px;font-weight:800;margin-left:8px;vertical-align:3px}
.lock{position:absolute;right:16px;top:14px;height:24px;padding:0 10px;border-radius:12px;background:#2E2D2A;color:#FF8A45;font-size:12px;font-weight:800;display:flex;align-items:center}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div class="scrim"></div>
<div class="sheet" style="top: 96px">
<button class="ck" style="left: 16px">‹</button>
<div class="st">Plans</div>
<button class="ck" style="right: 16px">+</button>
<div class="shelf on" style="top: 76px"><b>Push Pull Legs</b><span class="act">Active</span><div class="s">4 days, week 12</div><div class="carts"><div class="cart d"><i>PL1</i></div><div class="cart d"><i>LG1</i></div><div class="cart"><i>PS1</i></div><div class="cart"><i>LG2</i></div></div></div>
<div class="shelf" style="top: 238px"><b>Upper Lower</b><div class="s">4 days, last used in June</div><div class="carts"><div class="cart"><i>UA</i></div><div class="cart"><i>LA</i></div><div class="cart"><i>UB</i></div><div class="cart"><i>LB</i></div></div><span class="lock">PRO</span></div>
<div class="shelf" style="top: 400px"><b>Holiday Full Body</b><div class="s">3 days, hotel gym</div><div class="carts"><div class="cart"><i>FB1</i></div><div class="cart"><i>FB2</i></div><div class="cart"><i>FB3</i></div></div><span class="lock">PRO</span></div>
</div>
</div>
</body></html>
