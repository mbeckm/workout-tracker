<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>X2 Done, the receipt prints</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden}
.dim{color:#7A3E1C}
.key{border-radius:22px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.08);font-weight:800;color:#2A2925}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.dock{border-radius:40px 40px 0 0;box-shadow:0 -1px 0 #fff,0 -12px 30px rgba(60,50,30,.16)}
.slot{position:absolute;left:36px;right:36px;height:12px;border-radius:6px;background:#1C1B18;box-shadow:inset 0 3px 4px rgba(0,0,0,.8),0 1px 0 #fff}
.rc{position:absolute;left:52px;right:52px;background:#FFFEFA;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:20px;color:#2A2925;padding:22px 20px 18px;box-sizing:border-box;box-shadow:0 10px 30px rgba(60,50,30,.18)}
.rc .r{display:flex;justify-content:space-between}
.rc hr{border:0;border-top:1px dashed #B9B6AE;margin:10px 0}
.tear{position:absolute;left:0;right:0;top:-8px;height:8px;background:linear-gradient(135deg,transparent 50%,#FFFEFA 50%) 0 0/10px 8px repeat-x,linear-gradient(225deg,transparent 50%,#FFFEFA 50%) 0 0/10px 8px repeat-x}
@keyframes feed{from{transform:translateY(420px)}}
</style>
</head><body style="margin:0">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F2EE; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div class="rc" style="top: 70px; height: 470px; animation: feed 2.4s steps(24) both">
<div class="tear"></div>
<div style="text-align: center; font-weight: 700">TRIM</div>
<div style="text-align: center">PUSH 1  THU 2 OCT  52:10</div>
<hr>
<div class="r"><span>BENCH PRESS</span><span>3</span></div>
<div class="r" style="color: #8E8B83"><span>  85 × 8, 8, 7</span><span>NEW</span></div>
<div class="r"><span>CABLE FLY</span><span>3</span></div>
<div class="r" style="color: #8E8B83"><span>  15 × 12, 12, 12</span><span></span></div>
<div class="r"><span>OVERHEAD PRESS</span><span>3</span></div>
<div class="r" style="color: #8E8B83"><span>  45 × 8, 8, 8</span><span></span></div>
<div class="r"><span>DIPS</span><span>3</span></div>
<div class="r"><span>LATERAL RAISE</span><span>3</span></div>
<div class="r"><span>PUSHDOWN</span><span>1</span></div>
<hr>
<div class="r" style="font-weight: 700"><span>SETS</span><span>16</span></div>
<div class="r" style="font-weight: 700"><span>VOLUME</span><span>9,410 KG</span></div>
<div class="r" style="font-weight: 700; color: #C2410C"><span>BENCH E1RM</span><span>92.5 +2.5</span></div>
</div>
<div class="alu dock" style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px">
<div class="slot" style="top: 0"></div>
<div class="disp" style="top: 36px; left: 16px; right: 16px; height: 110px; padding: 16px 20px; box-sizing: border-box">
<div class="dim" style="font-size: 14px">WEEK 12</div>
<div style="margin-top: 8px; font-size: 34px">3 OF 4 DONE</div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 10px">
<button class="key" style="width: 110px; height: 84px; font-size: 17px">Share</button>
<button class="go" style="flex-grow: 1; height: 84px; font-size: 22px">Done</button>
</div>
</div>
</div>
</body></html>
