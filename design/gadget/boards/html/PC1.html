t:146px;border-radius:50%;background:radial-gradient(ellipse at 50% 22%,#FAF9F6,#D6D2CA 70%);box-shadow:inset 0 2px 0 #fff,0 6px 0 #A9A69E;color:#2A2925;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}.lab{position:absolute;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);white-space:nowrap;text-align:center}
