<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A2 Readout cards, range switch</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.key{border-radius:18px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.08);font-weight:800;color:#2A2925}
.card{background:#FBFAF7;border-radius:24px;box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(60,50,30,.10),0 1px 2px rgba(60,50,30,.1);padding:14px 16px;box-sizing:border-box;height:122px;position:relative}
.mut{color:#8E8B83}
.t{font-size:14px;font-weight:800;color:#8E8B83}
.v{margin-top:4px;font-size:34px;line-height:38px;font-weight:800;letter-spacing:-0.8px;font-variant-numeric:tabular-nums}
.d{position:absolute;left:16px;bottom:12px;font-size:14px;font-weight:800;color:#C2410C}
.dock{border-radius:40px 40px 0 0;box-shadow:0 -1px 0 #fff,0 -12px 30px rgba(60,50,30,.16)}
.slot{border-radius:22px;background:#2A2925;box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 #fff;position:relative;height:44px}
.thumb{position:absolute;top:4px;bottom:4px;border-radius:18px;background:repeating-linear-gradient(90deg,#F2F1ED 0 4px,#C4C1B9 4px 6px);box-shadow:0 2px 0 #8E8B83,inset 0 1px 0 #fff}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px;position:absolute;right:16px;top:16px}
.spark i{width:5px;border-radius:2px;background:#D9D6CF}
.spark i:last-child{background:#F2550F}
</style>
</head><body style="margin:0">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F2EE; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px">
<div class="mut" style="font-size: 15px; font-weight: 800">Last 3 months</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -0.6px">Progress</div>
</div>
<div style="position: absolute; top: 140px; left: 16px; right: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div class="card"><div class="t">Workouts</div><div class="v">38</div><div class="d">+6 vs before</div><div class="spark"><i style="height: 12px"></i><i style="height: 18px"></i><i style="height: 16px"></i><i style="height: 24px"></i></div></div>
<div class="card"><div class="t">Volume</div><div class="v">142 t</div><div class="d">+11%</div><div class="spark"><i style="height: 10px"></i><i style="height: 14px"></i><i style="height: 20px"></i><i style="height: 28px"></i></div></div>
<div class="card"><div class="t">Bench max</div><div class="v">92.5</div><div class="d">+7.5 kg</div></div>
<div class="card"><div class="t">Squat max</div><div class="v">125</div><div class="d">+10 kg</div></div>
<div class="card"><div class="t">Body weight</div><div class="v">81.4</div><div class="d" style="color: #8E8B83">−0.8 kg</div></div>
<div class="card" style="background: #2A2925; color: #fff"><div class="t" style="color: #B9B6AE">Stronger than</div><div class="v">64%</div><div class="d" style="color: #FF8A45">of lifters your weight</div></div>
</div>
<div class="alu dock" style="position: absolute; left: 0; right: 0; bottom: 0; height: 214px">
<div style="position: absolute; top: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between"><span class="lab">4 WK</span><span class="lab" style="color: #C2410C">3 MO</span><span class="lab">1 YR</span><span class="lab">ALL</span></div>
<div class="slot" style="position: absolute; top: 46px; left: 16px; right: 16px"><div class="thumb" style="left: 96px; width: 86px"></div></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 10px">
<button class="key" style="flex-grow: 1; height: 72px; font-size: 18px">Print this week</button>
<button class="key" style="width: 110px; height: 72px; font-size: 18px">History</button>
</div>
</div>
</div>
</body></html>
