<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>X4 Slide to start</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);position:absolute;white-space:nowrap}
.track{position:absolute;left:156px;width:78px;top:300px;height:440px;border-radius:39px;background:#2A2925;box-shadow:inset 0 4px 10px rgba(0,0,0,.6),0 1px 0 #fff}
.cut{position:absolute;left:35px;width:8px;top:30px;bottom:30px;border-radius:4px;background:#0E0E0D}
.fader{position:absolute;left:131px;width:128px;height:96px;border-radius:24px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 14px 24px rgba(200,70,10,.3);animation:slide 2.4s cubic-bezier(.5,0,.3,1) infinite}
.fader:before{content:"";position:absolute;left:20px;right:20px;top:46px;height:4px;border-radius:2px;background:rgba(255,255,255,.7)}
.tick{position:absolute;width:30px;height:3px;border-radius:2px;background:#A9A69E}
.led{width:14px;height:14px;border-radius:7px;background:#3A2214;position:absolute;left:188px}
@keyframes slide{0%,15%{top:630px}60%,85%{top:316px}100%{top:630px}}
@keyframes lamp{0%,55%{background:#3A2214;box-shadow:none}60%,85%{background:#FF6A1A;box-shadow:0 0 12px #FF6A1A}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div class="disp" style="top: 56px; left: 16px; right: 16px; height: 190px; padding: 18px 20px; box-sizing: border-box">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 15px"><span>THU 2 OCT</span><span>WEEK 12</span></div>
<div style="margin-top: 14px; font-size: 44px">PUSH 1</div>
<div class="dim" style="margin-top: 10px; font-size: 16px; line-height: 22px">BENCH  FLY  OHP  DIPS  RAISE  PUSHDOWN</div>
</div>
<div class="led" style="top: 270px; animation: lamp 2.4s infinite"></div>
<span class="lab" style="left: 260px; top: 318px">GO</span>
<span class="lab" style="left: 260px; top: 702px">READY</span>
<div class="tick" style="left: 104px; top: 340px"></div><div class="tick" style="left: 104px; top: 420px; width: 18px"></div><div class="tick" style="left: 104px; top: 500px; width: 18px"></div><div class="tick" style="left: 104px; top: 580px; width: 18px"></div><div class="tick" style="left: 104px; top: 680px"></div>
<div class="tick" style="left: 256px; top: 340px"></div><div class="tick" style="left: 256px; top: 420px; width: 18px"></div><div class="tick" style="left: 256px; top: 500px; width: 18px"></div><div class="tick" style="left: 256px; top: 580px; width: 18px"></div><div class="tick" style="left: 256px; top: 680px"></div>
<div class="track"><div class="cut"></div></div>
<div class="fader"></div>
</div>
</body></html>
