<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A1 Meters above, knob below</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);position:absolute;white-space:nowrap}
.card{background:#FBFAF7;border-radius:28px;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(60,50,30,.12),0 1px 2px rgba(60,50,30,.1)}
.mut{color:#8E8B83}
.dock{border-radius:40px 40px 0 0;box-shadow:0 -1px 0 #fff,0 -12px 30px rgba(60,50,30,.16)}
.m{padding:12px 0;border-top:1px solid #ECEAE4}
.m:first-child{border-top:0}
.mh{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:800}
.tr{margin-top:8px;height:12px;border-radius:6px;background:#ECEAE4;position:relative}
.fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#2A2925}
.was{position:absolute;top:-3px;width:3px;height:18px;border-radius:2px;background:#B9B6AE}
.sel .fl{background:#F2550F}
.up{color:#C2410C;font-size:14px;font-weight:800}
.knob{border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 2deg,#E4E0D7 2deg 4deg);box-shadow:0 6px 0 #A9A69E,0 14px 24px rgba(0,0,0,.2);position:absolute}
.cap{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FAF9F6,#D9D6CF);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.15)}
.ptr{position:absolute;left:50%;top:6px;width:5px;height:22px;margin-left:-2.5px;border-radius:3px;background:#FF6A1A}
@keyframes grow{from{width:0}}
</style>
</head><body style="margin:0">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F2EE; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px">
<div class="mut" style="font-size: 15px; font-weight: 800">Estimated max, last 8 weeks</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -0.6px">Progress</div>
</div>
<div class="card" style="position: absolute; top: 140px; left: 16px; right: 16px; padding: 8px 20px">
<div class="m sel"><div class="mh"><span>Bench Press</span><span>92.5 <span class="up">+4.5</span></span></div><div class="tr"><div class="fl" style="width: 62%; animation: grow .8s ease-out"></div><div class="was" style="left: 58%"></div></div></div>
<div class="m"><div class="mh"><span>Squat</span><span>125 <span class="up">+7.5</span></span></div><div class="tr"><div class="fl" style="width: 84%"></div><div class="was" style="left: 78%"></div></div></div>
<div class="m"><div class="mh"><span>Deadlift</span><span>148 <span class="up">+5</span></span></div><div class="tr"><div class="fl" style="width: 100%"></div><div class="was" style="left: 96%"></div></div></div>
<div class="m"><div class="mh"><span>Overhead Press</span><span>58 <span class="up">+1</span></span></div><div class="tr"><div class="fl" style="width: 39%"></div><div class="was" style="left: 38%"></div></div></div>
<div class="m"><div class="mh"><span>Barbell Row</span><span>84 <span class="mut" style="font-size: 14px">±0</span></span></div><div class="tr"><div class="fl" style="width: 57%"></div><div class="was" style="left: 57%"></div></div></div>
</div>
<div class="alu dock" style="position: absolute; left: 0; right: 0; bottom: 0; height: 270px">
<div class="disp" style="position: absolute; top: 24px; left: 16px; width: 214px; height: 210px; padding: 16px 18px; box-sizing: border-box">
<div class="dim" style="font-size: 14px">BENCH PRESS</div>
<div style="margin-top: 10px; font-size: 54px; line-height: 54px">92.5</div>
<div style="margin-top: 6px; font-size: 16px">+4.5 KG</div>
<div class="dim" style="position: absolute; left: 18px; right: 18px; bottom: 14px; font-size: 13px; line-height: 18px">BEST 85×6<br>ON 24 SEP</div>
</div>
<span class="lab" style="left: 274px; top: 30px">LIFT</span>
<div class="knob" style="left: 250px; top: 56px; width: 124px; height: 124px"><div class="cap" style="transform: rotate(-60deg)"><div class="ptr"></div></div></div>
<span class="lab" style="left: 252px; top: 200px">1  2  3  4  5</span>
</div>
</div>
</body></html>
