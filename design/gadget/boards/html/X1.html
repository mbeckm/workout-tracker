<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>X1 Hold to finish</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);position:absolute}
.key{border-radius:22px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.08);font-weight:800;color:#2A2925}
.big{border-radius:50%;background:radial-gradient(ellipse at 50% 20%,#FF8A45,#F2550F 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 #B83A05,0 6px 14px rgba(200,70,10,.3);color:#fff;font-weight:800;transform:translateY(5px)}
.well{border-radius:50%;background:#C4C1B9;box-shadow:inset 0 4px 10px rgba(0,0,0,.3),0 1px 0 #fff;position:absolute}
.led{width:10px;height:10px;border-radius:5px;background:#3A2214}
.on{background:#FF6A1A;box-shadow:0 0 6px #FF6A1A}
@keyframes fill{from{stroke-dashoffset:690}to{stroke-dashoffset:120}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div class="disp" style="top: 56px; left: 16px; right: 16px; height: 270px; padding: 18px 20px; box-sizing: border-box">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 15px"><span>PUSH 1</span><span>52:10</span></div>
<div style="margin-top: 14px; font-size: 40px">ALL DONE?</div>
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 120px"><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led on"></i><i class="led"></i><i class="led on"></i><i class="led"></i></div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 18px; display: flex; justify-content: space-between; font-size: 18px"><span>16 OF 18 SETS</span><span>9.4 T</span></div>
</div>
<span class="lab" style="left: 0; right: 0; top: 370px; text-align: center">FINISH</span>
<div class="well" style="left: 75px; top: 400px; width: 240px; height: 240px"></div>
<svg width="240" height="240" viewBox="0 0 240 240" style="position: absolute; left: 75px; top: 400px">
<circle cx="120" cy="120" r="110" fill="none" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" stroke-dasharray="690" transform="rotate(-90 120 120)" style="animation: fill 1.4s ease-in forwards; filter: drop-shadow(0 0 6px #FF6A1A)"></circle>
</svg>
<button class="big" style="position: absolute; left: 100px; top: 425px; width: 190px; height: 190px; font-size: 24px">Finish</button>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 10px">
<button class="key" style="flex-grow: 1; height: 72px; font-size: 17px">Back to Dips</button>
</div>
</div>
</body></html>
