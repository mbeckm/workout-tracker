<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>P2 Fill a day from the rolodex</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.dim{color:#7A3E1C}
.go{border-radius:22px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.key{border-radius:14px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E;font-weight:800;color:#2A2925;font-size:13px;height:38px;padding:0 12px}
.key.dn{background:linear-gradient(180deg,#D9D6CF,#E4E1DA);box-shadow:inset 0 2px 4px rgba(0,0,0,.18),0 1px 0 #fff;color:#C2410C}
.jog{border-radius:30px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 14px 16px rgba(0,0,0,.2),inset 0 -14px 16px rgba(0,0,0,.2),0 3px 0 #A9A69E}
.card{background:#FBFAF7;border-radius:28px;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(60,50,30,.12),0 1px 2px rgba(60,50,30,.1)}
.mut{color:#8E8B83}
.ex{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #ECEAE4;font-size:17px;font-weight:700}
.ex:first-child{border-top:0}
.n{width:24px;height:24px;border-radius:12px;background:#EFEDE8;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:10px;color:#8E8B83}
.fade{position:absolute;left:0;right:0;height:56px;z-index:1}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
@keyframes roll{from{background-position:0 0}to{background-position:0 28px}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: flex-end">
<div><div style="font-size: 15px; font-weight: 800; color: #7C7A73">Day 1 of 4</div><div style="font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.5px">Upper A</div></div>
<div style="display: flex; gap: 6px; padding-bottom: 8px"><i style="width: 22px; height: 6px; border-radius: 3px; background: #F2550F"></i><i style="width: 22px; height: 6px; border-radius: 3px; background: #C4C1B9"></i><i style="width: 22px; height: 6px; border-radius: 3px; background: #C4C1B9"></i><i style="width: 22px; height: 6px; border-radius: 3px; background: #C4C1B9"></i></div>
</div>
<div class="card" style="position: absolute; top: 140px; left: 16px; right: 16px; padding: 8px 20px">
<div class="ex"><span><span class="n">1</span>Bench Press</span><span class="mut">3 × 8</span></div>
<div class="ex"><span><span class="n">2</span>Barbell Row</span><span class="mut">3 × 8</span></div>
<div class="ex" style="animation: drop .4s ease-out"><span><span class="n" style="background: #FFE7D9; color: #C2410C">3</span>Incline Dumbbell Press</span><span class="mut">3 × 10</span></div>
</div>
<div style="position: absolute; top: 340px; left: 16px; right: 16px; display: flex; gap: 6px"><button class="key">ALL</button><button class="key dn">CHEST</button><button class="key">BACK</button><button class="key">LEGS</button><button class="key">SHLD</button><button class="key">ARMS</button></div>
<div style="position: absolute; top: 396px; left: 16px; right: 16px; display: flex; gap: 10px">
<div class="disp" style="flex-grow: 1; height: 260px">
<div class="fade" style="top: 0; background: linear-gradient(180deg, #121211, rgba(18,18,17,0))"></div>
<div class="fade" style="bottom: 0; background: linear-gradient(0deg, #121211, rgba(18,18,17,0))"></div>
<div class="dim" style="position: absolute; left: 20px; top: 20px; font-size: 18px; line-height: 40px">DUMBBELL PRESS<br>INCLINE BENCH</div>
<div style="position: absolute; left: 20px; top: 108px; font-size: 22px">CABLE FLY</div>
<div class="dim" style="position: absolute; left: 20px; top: 136px; font-size: 13px">CABLE, CHEST</div>
<div class="dim" style="position: absolute; left: 20px; top: 172px; font-size: 18px; line-height: 40px">DIPS<br>MACHINE PRESS</div>
<div style="position: absolute; left: 10px; right: 10px; top: 96px; height: 66px; border-radius: 16px; box-shadow: inset 0 0 0 2px #FF6A1A"></div>
</div>
<div class="jog" style="width: 68px; height: 260px; animation: roll 1.6s ease-in-out infinite alternate"></div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 10px">
<button class="key" style="width: 84px; height: 84px; border-radius: 22px; font-size: 13px; line-height: 16px">Next<br>day</button>
<button class="go" style="flex-grow: 1; height: 84px; font-size: 22px">Add Cable Fly</button>
</div>
</div>
</body></html>
