<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>QA1 A: progress panel sheet</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}button{font:inherit;color:inherit;border:0;background:none;padding:0}.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),linear-gradient(180deg,#E4E2DC,#D2CFC8)}.scrim{position:absolute;inset:0;background:rgba(20,18,15,.4)}.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;overflow:hidden}.st{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:18px;font-weight:800}.ck{position:absolute;top:14px;height:40px;min-width:40px;padding:0 14px;box-sizing:border-box;border-radius:20px;background:#262624;display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:16px;font-weight:800}.dc{position:absolute;left:12px;right:12px;background:#232321;border-radius:24px;overflow:hidden}.sec{position:absolute;left:28px;font-family:'Doto',monospace;font-weight:900;font-size:13px;letter-spacing:1px;color:#6E6C66}.sm{color:#8C8A84}
.goal{position:absolute;top:0;width:110px;height:136px;border-radius:22px;background:#232321;text-align:center;padding-top:12px;box-sizing:border-box}
.goal b{display:block;font-size:14px;font-weight:800;margin-top:6px}
.goal span{display:block;font-size:12px;font-weight:700;color:#8C8A84}
.lift{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #2E2E2B}
.lift:first-child{border-top:0}
.lift .n{flex:1;font-size:16px;font-weight:800}
.lift .v{font-size:17px;font-weight:800;text-align:right;width:66px}
.lift .d{display:block;font-size:12px;font-weight:800;color:#C9C6BF}
.rec{color:#F5C542}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div class="scrim"></div>
<div class="sheet" style="top: 60px">
<button class="ck" style="left: 16px">‹</button>
<div class="st">Progress</div>
<div style="position: absolute; left: 50%; top: 66px; margin-left: -80px; width: 160px; height: 92px; border-radius: 80px 80px 16px 16px; background: linear-gradient(180deg,#ECEAE4,#C9C5BC); box-shadow: inset 0 2px 0 #fff, 0 7px 0 #6E6B64, 0 16px 26px rgba(0,0,0,.5)">
<div style="position: absolute; left: 11px; right: 11px; top: 11px; bottom: 11px; border-radius: 70px 70px 9px 9px; background: #121211; overflow: hidden">
<svg width="138" height="70" viewBox="0 0 138 70" style="position: absolute; left: 0; top: 0"><path d="M14 66 A55 55 0 0 1 124 66" fill="none" stroke="#3A2214" stroke-width="3" stroke-dasharray="2 6"></path><path d="M92 21 A55 55 0 0 1 124 66" fill="none" stroke="#FF6A1A" stroke-width="3"></path></svg>
<i style="position: absolute; left: 68px; bottom: 4px; width: 3px; height: 52px; background: #FF6A1A; border-radius: 2px; transform-origin: 50% 100%; transform: rotate(13deg)"></i>
</div></div>
<div style="position: absolute; left: 24px; right: 24px; top: 172px; text-align: center; font-size: 21px; line-height: 26px; font-weight: 800; letter-spacing: -.3px">Stronger than 64% of lifters your weight</div>
<div class="sec" style="top: 236px">GOALS</div>
<div style="position: absolute; left: 16px; right: 16px; top: 260px; height: 136px">
<div class="goal" style="left: 0"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#33322F" stroke-width="6"></circle><circle cx="32" cy="32" r="26" fill="none" stroke="#5DAA68" stroke-width="6" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="25" transform="rotate(-90 32 32)"></circle><text x="32" y="37" text-anchor="middle" fill="#F3F2EE" font-size="14" font-weight="800" font-family="ui-rounded,sans-serif">85%</text></svg><b>Bench 100</b><span>at 92.5</span></div>
<div class="goal" style="left: 119px"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#33322F" stroke-width="6"></circle><circle cx="32" cy="32" r="26" fill="none" stroke="#5DAA68" stroke-width="6" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="70" transform="rotate(-90 32 32)"></circle><text x="32" y="37" text-anchor="middle" fill="#F3F2EE" font-size="14" font-weight="800" font-family="ui-rounded,sans-serif">57%</text></svg><b>Squat 140</b><span>at 125</span></div>
<div class="goal" style="left: 238px"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#33322F" stroke-width="6"></circle><circle cx="32" cy="32" r="26" fill="none" stroke="#5DAA68" stroke-width="6" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="98" transform="rotate(-90 32 32)"></circle><text x="32" y="37" text-anchor="middle" fill="#F3F2EE" font-size="14" font-weight="800" font-family="ui-rounded,sans-serif">40%</text></svg><b>Body 78</b><span>at 81.4</span></div>
</div>
<div class="sec" style="top: 418px">LIFTS, 30 DAYS</div>
<div class="dc" style="top: 442px">
<div class="lift"><span class="n">Bench Press</span><svg width="70" height="24"><path d="M2 20 L14 18 L26 19 L38 13 L50 11 L62 6 L68 4" fill="none" stroke="#F5C542" stroke-width="2.5" stroke-linecap="round"></path></svg><span class="v rec">92.5<span class="d rec">★ +2.5</span></span></div>
<div class="lift"><span class="n">Squat</span><svg width="70" height="24"><path d="M2 18 L14 17 L26 14 L38 14 L50 10 L62 8 L68 7" fill="none" stroke="#F3F2EE" stroke-width="2.5" stroke-linecap="round"></path></svg><span class="v">125<span class="d">↑ 5</span></span></div>
<div class="lift"><span class="n">Deadlift</span><svg width="70" height="24"><path d="M2 14 L14 13 L26 14 L38 12 L50 12 L62 11 L68 11" fill="none" stroke="#F3F2EE" stroke-width="2.5" stroke-linecap="round"></path></svg><span class="v">148<span class="d">↑ 2.5</span></span></div>
<div class="lift"><span class="n">Overhead Press</span><svg width="70" height="24"><path d="M2 12 L14 12 L26 13 L38 12 L50 12 L62 12 L68 12" fill="none" stroke="#6E6C66" stroke-width="2.5" stroke-linecap="round"></path></svg><span class="v">58<span class="d sm">±0</span></span></div>
<div class="lift"><span class="n">Body weight</span><svg width="70" height="24"><path d="M2 6 L14 8 L26 8 L38 11 L50 12 L62 14 L68 15" fill="none" stroke="#F3F2EE" stroke-width="2.5" stroke-linecap="round"></path></svg><span class="v">81.4<span class="d">↓ 0.8</span></span></div>
</div>
</div>
</div>
</body></html>
