<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>H2 Knob picks the day</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);position:absolute;white-space:nowrap}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.knob{border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 2deg,#E4E0D7 2deg 4deg);box-shadow:0 7px 0 #A9A69E,0 18px 30px rgba(0,0,0,.2);position:absolute}
.cap{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FAF9F6,#D9D6CF);box-shadow:inset 0 1px 0 #fff,0 3px 6px rgba(0,0,0,.18);transform:rotate(38deg)}
.ptr{position:absolute;left:50%;top:8px;width:6px;height:30px;margin-left:-3px;border-radius:3px;background:#FF6A1A;box-shadow:0 0 8px rgba(255,106,26,.6)}
.tick{position:absolute;width:3px;height:12px;background:#7C7A73;border-radius:2px;left:50%;top:50%;margin-left:-1.5px}
.dot{width:10px;height:10px;border-radius:5px;background:#3A2214}
.dot.on{background:#FF6A1A;box-shadow:0 0 6px #FF6A1A}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: flex-end">
<div><div style="font-size: 15px; font-weight: 800; color: #7C7A73">Week 12</div><div style="font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.5px">2 of 4 done</div></div>
<div style="display: flex; gap: 6px; padding-bottom: 8px"><i class="dot on"></i><i class="dot on"></i><i class="dot" style="box-shadow: inset 0 0 0 2px #FF6A1A"></i><i class="dot"></i></div>
</div>
<div class="disp" style="position: absolute; top: 140px; left: 16px; right: 16px; height: 236px; padding: 18px 20px; box-sizing: border-box">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 14px"><span>NEXT UP</span><span>6 LIFTS ~52 MIN</span></div>
<div style="margin-top: 8px; font-size: 40px">PUSH 1</div>
<div style="margin-top: 10px; font-size: 16px; line-height: 26px">BENCH PRESS<span class="dim">  3×8</span><br>CABLE FLY<span class="dim">  3×12</span><br>OVERHEAD PRESS<span class="dim">  3×8</span><br><span class="dim">DIPS, LATERAL RAISE, PUSHDOWN</span></div>
</div>
<div style="position: absolute; top: 400px; left: 0; width: 390px; height: 260px">
<span class="lab" style="left: 52px; top: 18px; color: #A9A69E">PULL 1 ✓</span>
<span class="lab" style="left: 280px; top: 18px; color: #A9A69E">LEGS 1 ✓</span>
<span class="lab" style="left: 296px; top: 214px">LEGS 2</span>
<span class="lab" style="left: 40px; top: 214px; color: #C2410C">PUSH 1</span>
<div class="knob" style="left: 105px; top: 40px; width: 180px; height: 180px"><div class="cap" style="transform: rotate(-135deg)"><div class="ptr"></div></div></div>
</div>
<button class="go" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 84px; font-size: 22px">Start Push 1</button>
</div>
</body></html>
