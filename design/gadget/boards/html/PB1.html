<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PB1 B: pick a plan pack</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}button{font:inherit;color:inherit;border:0;background:none;padding:0}
.grid{background-color:#0E0E0D;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
.pack{position:absolute;left:16px;right:16px;height:150px;border-radius:26px;background:#1C1C1A;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);padding:16px 18px;box-sizing:border-box}
.pack.on{box-shadow:inset 0 0 0 3px #FF6A1A}
.pack b{font-size:20px;font-weight:800;display:block}
.pack span.s{font-size:14px;font-weight:600;color:#8C8A84;display:block;margin-top:2px}
.carts{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;align-items:flex-end}
.cart{width:40px;height:64px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,#ECEAE4,#C9C5BC);box-shadow:inset 0 2px 0 #fff,0 5px 0 #6E6B64;position:relative}
.cart i{position:absolute;left:5px;right:5px;top:7px;height:24px;border-radius:4px;background:#121211;color:#FF6A1A;font:900 9px/24px 'Doto',monospace;text-align:center;font-style:normal}
.cart u{position:absolute;left:9px;right:9px;bottom:7px;height:10px;background:repeating-linear-gradient(90deg,#B9B4AA 0 2px,transparent 2px 4px)}
.cart.blank{background:transparent;box-shadow:inset 0 0 0 2px #3A3936;display:flex;align-items:center;justify-content:center;color:#6E6C66;font-size:22px;font-weight:800}
.tags{position:absolute;left:18px;bottom:16px;display:flex;gap:6px}
.tag{height:24px;padding:0 10px;border-radius:12px;background:#2E2D2A;color:#C9C6BF;font-size:12px;font-weight:800;display:flex;align-items:center}
.cta{position:absolute;left:16px;right:16px;bottom:34px;height:60px;border-radius:30px;background:#FBFAF7;color:#1C1B18;font-size:18px;font-weight:800}
</style>
</head><body style="margin:0">
<div class="grid" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #F3F2EE; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -.5px">Pick a plan</div>
<div style="position: absolute; left: 0; right: 0; top: 112px; text-align: center; font-size: 15px; font-weight: 600; color: #8C8A84">4 days a week</div>
<div class="pack on" style="top: 152px"><b>Push Pull Legs</b><span class="s">Strength and size</span><div class="tags"><span class="tag">4 days</span><span class="tag">~50 min</span></div><div class="carts"><div class="cart"><i>PL1</i><u></u></div><div class="cart"><i>LG1</i><u></u></div><div class="cart"><i>PS1</i><u></u></div><div class="cart"><i>LG2</i><u></u></div></div></div>
<div class="pack" style="top: 314px"><b>Upper Lower</b><span class="s">Balanced, simple</span><div class="tags"><span class="tag">4 days</span><span class="tag">~55 min</span></div><div class="carts"><div class="cart"><i>UA</i><u></u></div><div class="cart"><i>LA</i><u></u></div><div class="cart"><i>UB</i><u></u></div><div class="cart"><i>LB</i><u></u></div></div></div>
<div class="pack" style="top: 476px"><b>Build my own</b><span class="s">Start from empty days</span><div class="carts"><div class="cart blank">+</div><div class="cart blank">+</div><div class="cart blank">+</div><div class="cart blank">+</div></div></div>
<button class="cta">Load Push Pull Legs</button>
</div>
</body></html>
