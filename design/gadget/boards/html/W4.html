<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>W4 Day cards you swipe</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{position:absolute;border-radius:28px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;overflow:hidden;box-sizing:border-box}
.dim{color:#7A3E1C}
.rk{position:absolute;width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;color:#2A2925;font-weight:800}
.plate{position:absolute;left:100px;top:62px;width:190px;height:44px;border-radius:22px;background:#C9C6BE;box-shadow:inset 0 2px 5px rgba(0,0,0,.25),0 1px 0 #fff;display:flex;align-items:center;justify-content:center;gap:10px}
.lamp{width:12px;height:12px;border-radius:6px;background:#8E8A80;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.lamp.done{background:#FF6A1A;box-shadow:0 0 6px rgba(255,106,26,.6)}
.lamp.on{box-shadow:inset 0 0 0 2px #FF6A1A;background:#C9C6BE}
.jog{position:absolute;border-radius:24px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 16px 16px rgba(0,0,0,.22),inset 0 -16px 16px rgba(0,0,0,.22),0 3px 0 #A9A69E}
.big{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 22%,#FF8A45,#F2550F 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(150,40,0,.25),0 6px 0 #B83A05,0 16px 26px rgba(200,70,10,.3);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.big.metal{background:radial-gradient(ellipse at 50% 22%,#FAF9F6,#D6D2CA 70%);color:#2A2925;box-shadow:inset 0 2px 0 #fff,0 6px 0 #A9A69E}
.well{position:absolute;border-radius:50%;background:#C4C1B9;box-shadow:inset 0 4px 10px rgba(0,0,0,.28),0 1px 0 #fff}
.card{position:absolute;top:18px;bottom:44px;width:290px;border-radius:20px;padding:18px;box-sizing:border-box}
.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;gap:8px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:#3A2214}
.dots i.on{background:#FF6A1A}
.big-check{font-size:120px;line-height:110px;margin-top:20px}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<button class="rk" style="left: 20px; top: 56px" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 22 22"><g stroke="#2A2925" stroke-width="2.6" stroke-linecap="round"><line x1="3" y1="6" x2="19" y2="6"></line><line x1="3" y1="16" x2="19" y2="16"></line></g><circle cx="8" cy="6" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle><circle cx="14" cy="16" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle></svg></button>
<div class="plate"><i class="lamp done"></i><i class="lamp done"></i><i class="lamp on"></i><i class="lamp"></i></div>
<button class="rk" style="right: 20px; top: 56px" aria-label="History"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="#2A2925" stroke-width="2.4"></circle><path d="M11 6 V11 L14.5 13" fill="none" stroke="#2A2925" stroke-width="2.4" stroke-linecap="round"></path></svg></button>
<div class="disp" style="top: 140px; left: 20px; right: 20px; height: 420px">
<div class="card" style="left: -250px; background: #FF6A1A; color: #121211"></div>
<div class="card" style="left: 26px; background: #FF6A1A; color: #121211">
<div style="display: flex; justify-content: space-between; font-size: 15px"><span>TUE</span><span>DONE</span></div>
<div style="font-size: 44px; line-height: 46px; margin-top: 10px">LEGS 1</div>
<div class="big-check">✓</div>
<div style="position: absolute; left: 18px; right: 18px; bottom: 18px; font-size: 15px; line-height: 24px">55 MIN  9 SETS<br>11,240 KG<br>SQUAT 125 PR</div>
</div>
<div class="card" style="left: 328px; box-shadow: inset 0 0 0 2px #FF6A1A"><div style="font-size: 15px">NEXT</div><div style="font-size: 44px; line-height: 46px; margin-top: 10px">PUSH 1</div></div>
<div class="dots"><i class="on"></i><i class="on" style="box-shadow: 0 0 0 3px rgba(255,106,26,.3)"></i><i></i><i></i></div>
</div>
<div class="flip" style="position: absolute; left: 22px; top: 600px; width: 64px; height: 76px; border-radius: 14px; background: #1C1B18; color: #F3F2EE; font-family: 'Doto', monospace; font-weight: 900; font-size: 36px; line-height: 76px; text-align: center">07</div>
<div style="position: absolute; left: 22px; top: 684px; width: 64px; text-align: center; font-size: 12px; font-weight: 800; color: #7C7A73">week<br>streak</div>
<div class="well" style="left: 110px; top: 590px; width: 170px; height: 170px"></div>
<button class="big metal" style="left: 122px; top: 600px; width: 146px; height: 146px; font-size: 19px">Receipt</button>
<div class="jog" style="right: 22px; top: 588px; width: 64px; height: 180px"></div>
</div>
</body></html>
