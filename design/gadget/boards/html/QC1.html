body{margin:0}button{font:inherit;color:inherit;border:0;background:none;padding:0}.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),linear-gradient(180deg,#E4E2DC,#D2CFC8)}.scrim{position:absolute;inset:0;background:rgba(20,18,15,.4)}.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;overflow:hidden}.st{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:18px;font-weight:800}.ck{position:absolute;top:14px;height:40px;min-width:40px;padding:0 14px;box-sizing:border-box;border-radius:20px;background:#262624;display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:16px;font-weight:800}.dc{position:absolute;left:12px;right:12px;background:#232321;border-radius:24px;overflow:hidden}.sec{position:absolute;left:28px;font-family:'Doto',monospace;font-weight:900;font-size:13px;letter-spacing:1px;color:#6E6C66}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #2E2E2B;font-size:16px;font-weight:700}.row:first-child{border-top:0}

.lamps{display:flex;gap:6px}.lamps i{width:10px;height:10px;border-radius:5px;background:#5DAA68}
