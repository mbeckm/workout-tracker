<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G4 Wrist computer</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.scan:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,106,26,.06) 0 1px,rgba(0,0,0,0) 1px 3px),radial-gradient(ellipse at 50% 40%,rgba(255,106,26,.10),rgba(0,0,0,0) 70%);pointer-events:none}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.key{border-radius:18px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.08);font-weight:800;color:#2A2925}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.knob{border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 2deg,#E4E0D7 2deg 4deg);box-shadow:0 5px 0 #A9A69E,0 12px 20px rgba(0,0,0,.18);position:relative}
.cap{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FAF9F6,#D9D6CF);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.15)}
.ptr{position:absolute;left:50%;top:5px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:#FF6A1A}
.tab{padding:2px 8px;font-size:15px}
.tab.sel{box-shadow:inset 0 0 0 2px #FF6A1A;border-radius:6px}
.row{display:flex;justify-content:space-between;font-size:17px;line-height:30px}
@keyframes blink{50%{opacity:0}}
@keyframes roll{from{background-position:0 0}to{background-position:0 28px}}
.jog{border-radius:30px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 14px 16px rgba(0,0,0,.2),inset 0 -14px 16px rgba(0,0,0,.2),0 3px 0 #A9A69E}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div class="disp scan" style="position: absolute; top: 56px; left: 16px; right: 16px; height: 470px; padding: 16px 18px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between"><span class="tab sel">SET</span><span class="tab dim">REST</span><span class="tab dim">QUEUE</span><span class="tab dim">DATA</span></div>
<div style="margin-top: 10px; height: 2px; background: #7A3E1C"></div>
<div style="margin-top: 18px; font-size: 32px">BENCH PRESS</div>
<div class="dim" style="font-size: 15px; margin-top: 4px">SET 2/3  LAST 80×8</div>
<div style="margin-top: 22px; display: flex; align-items: flex-end; gap: 10px"><span style="font-size: 96px; line-height: 84px">85.0</span><span style="font-size: 22px; padding-bottom: 6px">KG</span></div>
<div style="margin-top: 10px; display: flex; gap: 3px">
<i style="flex-grow: 1; height: 12px; background: #FF6A1A"></i><i style="flex-grow: 1; height: 12px; background: #FF6A1A"></i><i style="flex-grow: 1; height: 12px; background: #FF6A1A"></i><i style="flex-grow: 1; height: 12px; background: #FF6A1A"></i><i style="flex-grow: 1; height: 12px; background: #FF6A1A"></i><i style="flex-grow: 1; height: 12px; background: #FF6A1A"></i><i style="flex-grow: 1; height: 12px; background: #FF6A1A"></i><i style="flex-grow: 1; height: 12px; background: #3A2214"></i><i style="flex-grow: 1; height: 12px; background: #3A2214"></i><i style="flex-grow: 1; height: 12px; background: #3A2214"></i>
</div>
<div class="dim" style="margin-top: 6px; display: flex; justify-content: space-between; font-size: 13px"><span>OF BEST E1RM</span><span>92.5</span></div>
<div style="margin-top: 26px; display: flex; align-items: flex-end; gap: 10px"><span style="font-size: 56px; line-height: 50px">×8</span><span class="dim" style="font-size: 18px; padding-bottom: 4px">REPS</span></div>
<div style="position: absolute; left: 18px; bottom: 16px; font-size: 15px"><span class="dim">NEXT</span> CABLE FLY<span style="animation: blink 1s steps(1) infinite">_</span></div>
</div>
<div style="position: absolute; top: 544px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 22px"><span class="lab">MODE</span><span class="lab">REPS</span><span class="lab">WEIGHT</span></div>
<div class="knob" style="position: absolute; top: 568px; left: 18px; width: 104px; height: 104px"><div class="cap"><div class="ptr"></div></div></div>
<div style="position: absolute; top: 576px; left: 140px; display: flex; flex-direction: column; gap: 10px">
<button class="key" style="width: 100px; height: 44px; font-size: 22px" aria-label="More reps">+</button>
<button class="key" style="width: 100px; height: 44px; font-size: 22px" aria-label="Fewer reps">−</button>
</div>
<div class="jog" style="position: absolute; top: 562px; right: 18px; width: 96px; height: 116px; border-radius: 28px; animation: roll 1.6s ease-in-out infinite alternate"></div>
<button class="go" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 84px; font-size: 22px">Log set</button>
</div>
</body></html>
