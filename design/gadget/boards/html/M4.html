<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>M4 Exercise sheet with how-to</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.rk{position:absolute;width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;box-shadow:0 -10px 30px rgba(0,0,0,.35);overflow:hidden}
.ck{position:absolute;top:14px;height:40px;min-width:40px;padding:0 14px;box-sizing:border-box;border-radius:20px;background:rgba(38,38,36,.85);display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:16px;font-weight:800;z-index:2}
.dc{background:#232321;border-radius:24px}
.sm{color:#8C8A84}
.sec{font-family:'Doto',monospace;font-weight:900;font-size:13px;letter-spacing:1px;color:#6E6C66}
.step{display:flex;gap:14px;padding:12px 18px;border-top:1px solid #2E2E2B;font-size:15px;line-height:21px;font-weight:600;color:#D9D6CF}
.step:first-child{border-top:0}
.step b{font-family:'Doto',monospace;font-weight:900;color:#FF6A1A;font-size:15px;flex-shrink:0;width:14px}
.chip{display:inline-flex;height:28px;align-items:center;padding:0 12px;border-radius:14px;background:#2E2D2A;font-size:13px;font-weight:800;color:#D9D6CF;margin:0 6px 6px 0}
.chip.p{background:#FF6A1A;color:#1C0E05}
@keyframes press{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div class="rk" style="left: 20px; top: 56px"></div><div class="rk" style="right: 20px; top: 56px"></div>
<div style="position: absolute; inset: 0; background: rgba(20,18,15,.4)"></div>
<div class="sheet" style="top: 60px">
<button class="ck" style="left: 16px">‹</button>
<div style="position: absolute; left: 12px; right: 12px; top: 12px; height: 250px; border-radius: 28px; overflow: hidden; background: radial-gradient(ellipse at 50% 60%, #2E2620, #161412)">
<svg width="366" height="250" viewBox="0 0 366 250" style="position: absolute; left: 0; top: 0">
<rect x="70" y="196" width="226" height="14" rx="7" fill="#3A3936"></rect>
<rect x="96" y="210" width="10" height="34" fill="#3A3936"></rect><rect x="260" y="210" width="10" height="34" fill="#3A3936"></rect>
<rect x="118" y="168" width="150" height="30" rx="14" fill="#4A4843"></rect>
<g fill="none" stroke="#E4E2DC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<circle cx="96" cy="174" r="15" fill="#E4E2DC" stroke="none"></circle>
<path d="M112 176 L232 178"></path>
<path d="M232 178 L262 214 L262 236"></path>
<g style="animation: press 2.4s ease-in-out infinite"><path d="M150 176 L150 132 L150 102"></path><path d="M206 177 L206 132 L206 102"></path>
<rect x="64" y="94" width="238" height="7" rx="3.5" fill="#B9B6AE" stroke="none"></rect>
<rect x="72" y="76" width="16" height="44" rx="4" fill="#FF6A1A" stroke="none"></rect><rect x="278" y="76" width="16" height="44" rx="4" fill="#FF6A1A" stroke="none"></rect></g>
</g>
</svg>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 278px"><div style="font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -.5px">Bench Press</div><div class="sm" style="margin-top: 4px; font-size: 15px; font-weight: 600">Barbell, chest</div></div>
<div style="position: absolute; left: 24px; right: 24px; top: 352px"><span class="chip p">Chest</span><span class="chip">Front delts</span><span class="chip">Triceps</span></div>
<div class="sec" style="position: absolute; left: 28px; top: 404px">HOW TO</div>
<div class="dc" style="position: absolute; left: 12px; right: 12px; top: 428px">
<div class="step"><b>1</b><span>Eyes under the bar, feet flat, shoulder blades pinned back.</span></div>
<div class="step"><b>2</b><span>Lower the bar to mid-chest with elbows about 45° from your body.</span></div>
<div class="step"><b>3</b><span>Press up and slightly back until your arms are straight.</span></div>
</div>
<div class="sec" style="position: absolute; left: 28px; top: 640px">YOU</div>
<div class="dc" style="position: absolute; left: 12px; right: 12px; top: 664px; height: 70px; display: flex; align-items: center; justify-content: space-around; text-align: center">
<div><div style="font-size: 20px; font-weight: 800">92.5</div><div class="sm" style="font-size: 12px; font-weight: 700">Est. max</div></div>
<div><div style="font-size: 20px; font-weight: 800">85 × 8</div><div class="sm" style="font-size: 12px; font-weight: 700">Best set</div></div>
<div><div style="font-size: 20px; font-weight: 800; color: #FF6A1A">Top 36%</div><div class="sm" style="font-size: 12px; font-weight: 700">Your weight</div></div>
</div>
</div>
</div>
</body></html>
