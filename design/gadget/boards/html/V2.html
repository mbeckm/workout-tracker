<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>V2 Wheel for weight, keys for reps</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:28px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden;box-sizing:border-box}
.dim{color:#7A3E1C}
.rk{position:absolute;width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;color:#2A2925;font-weight:800}
.plate{position:absolute;left:100px;top:62px;width:190px;height:44px;border-radius:22px;background:#C9C6BE;box-shadow:inset 0 2px 5px rgba(0,0,0,.25),0 1px 0 #fff;display:flex;align-items:center;justify-content:center;gap:10px}
.lamp{width:12px;height:12px;border-radius:6px;background:#8E8A80;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.lamp.on{background:#FF6A1A;box-shadow:0 0 8px #FF6A1A}
.jog{position:absolute;border-radius:24px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 16px 16px rgba(0,0,0,.22),inset 0 -16px 16px rgba(0,0,0,.22),0 3px 0 #A9A69E,0 8px 14px rgba(0,0,0,.08)}
.shut{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 22%,#FF8A45,#F2550F 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(150,40,0,.25),0 6px 0 #B83A05,0 16px 26px rgba(200,70,10,.3);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;background:#C4C1B9;box-shadow:inset 0 4px 10px rgba(0,0,0,.28),0 1px 0 #fff}
.fade{position:absolute;left:0;right:0;height:60px;z-index:1}
@keyframes vroll{from{background-position:0 0}to{background-position:0 28px}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<button class="rk" style="left: 20px; top: 56px" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 22 22"><g stroke="#2A2925" stroke-width="2.6" stroke-linecap="round"><line x1="3" y1="6" x2="19" y2="6"></line><line x1="3" y1="16" x2="19" y2="16"></line></g><circle cx="8" cy="6" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle><circle cx="14" cy="16" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle></svg></button>
<div class="plate"><i class="lamp on"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
<button class="rk" style="right: 20px; top: 56px; font-size: 22px" aria-label="Swap lift">⇄</button>
<div class="disp" style="top: 140px; left: 20px; right: 20px; height: 420px">
<div class="dim" style="position: absolute; left: 22px; right: 22px; top: 20px; display: flex; justify-content: space-between; font-size: 15px"><span>BENCH PRESS</span><span>SET 2/3</span></div>
<div class="fade" style="top: 50px; background: linear-gradient(180deg, #121211, rgba(18,18,17,0))"></div>
<div class="dim" style="position: absolute; left: 22px; top: 64px; font-size: 40px">87.5</div>
<div style="position: absolute; left: 22px; top: 122px; font-size: 104px; line-height: 104px">85.0</div>
<div class="dim" style="position: absolute; left: 22px; top: 240px; font-size: 40px">82.5</div>
<div style="position: absolute; left: 10px; right: 10px; top: 112px; height: 124px; border-radius: 20px; box-shadow: inset 0 0 0 2px #FF6A1A"></div>
<div style="position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 56px; line-height: 56px">×8</span><span class="dim" style="font-size: 15px">LAST 80×8</span></div>
</div>
<button class="rk" style="left: 22px; top: 592px; width: 64px; height: 76px; border-radius: 22px; font-size: 26px" aria-label="More reps">+</button>
<button class="rk" style="left: 22px; top: 680px; width: 64px; height: 76px; border-radius: 22px; font-size: 26px" aria-label="Fewer reps">−</button>
<div class="ring" style="left: 110px; top: 590px; width: 170px; height: 170px"></div>
<button class="shut" style="left: 122px; top: 600px; width: 146px; height: 146px; font-size: 24px">Log</button>
<div class="jog" style="right: 22px; top: 588px; width: 64px; height: 180px; animation: vroll 1.6s ease-in-out infinite alternate"></div>
</div>
</body></html>
