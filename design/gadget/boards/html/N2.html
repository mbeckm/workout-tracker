<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Device logging, info only while you turn</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:28px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden;box-sizing:border-box}
.dim{color:#7A3E1C}
.rk{position:absolute;width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;color:#2A2925}
.roller{position:absolute;border-radius:18px;background:repeating-linear-gradient(90deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 18px 0 16px rgba(0,0,0,.22),inset -18px 0 16px rgba(0,0,0,.22),0 3px 0 #A9A69E,0 8px 14px rgba(0,0,0,.08)}
.jog{position:absolute;border-radius:24px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 16px 16px rgba(0,0,0,.22),inset 0 -16px 16px rgba(0,0,0,.22),0 3px 0 #A9A69E,0 8px 14px rgba(0,0,0,.08)}
.shut{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 22%,#FF8A45,#F2550F 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(150,40,0,.25),0 6px 0 #B83A05,0 16px 26px rgba(200,70,10,.3);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring{position:absolute;border-radius:50%;background:#C4C1B9;box-shadow:inset 0 4px 10px rgba(0,0,0,.28),0 1px 0 #fff}
.flip{position:absolute;width:60px;border-radius:14px;background:#1C1B18;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 #fff;color:#F3F2EE;font-family:'Doto',monospace;font-weight:900;text-align:center;overflow:hidden}
.flip:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000}
.scale{position:absolute;right:0;top:0;bottom:0;width:46px}
.scale i{position:absolute;right:0;height:2px;background:#7A3E1C}
.plate{position:absolute;border-radius:3px;background:#FF6A1A}
@keyframes vroll{from{background-position:0 0}to{background-position:0 28px}}
@keyframes ghost{0%,30%{opacity:0;transform:translateY(6px)}45%,85%{opacity:1;transform:none}100%{opacity:0}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<button class="rk" style="left: 20px; top: 56px" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 22 22"><g stroke="#2A2925" stroke-width="2.6" stroke-linecap="round"><line x1="3" y1="6" x2="19" y2="6"></line><line x1="3" y1="16" x2="19" y2="16"></line></g><circle cx="8" cy="6" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle><circle cx="14" cy="16" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle></svg></button>
<div class="roller" style="left: 100px; top: 52px; width: 190px; height: 64px"></div>
<div style="position: absolute; left: 100px; top: 122px; width: 190px; text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #7C7A73">REPS</div>
<button class="rk" style="right: 20px; top: 56px; font-size: 22px; font-weight: 800" aria-label="Swap lift">⇄</button>
<div class="disp" style="top: 148px; left: 20px; right: 20px; height: 412px; padding: 22px">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 15px"><span>BENCH PRESS</span><span>SET 2/3</span></div>
<div style="position: absolute; left: 22px; top: 92px; font-size: 104px; line-height: 96px">85.0</div>
<div style="position: absolute; left: 26px; top: 196px; font-size: 22px">KG</div>
<div style="position: absolute; left: 22px; top: 248px; font-size: 64px; line-height: 64px">×8</div>
<div class="scale" style="top: 60px; bottom: 60px"><i style="top: 0; width: 14px"></i><i style="top: 24px; width: 8px"></i><i style="top: 48px; width: 14px"></i><i style="top: 72px; width: 8px"></i><i style="top: 96px; width: 14px"></i><i style="top: 120px; width: 26px; height: 3px; background: #FF6A1A"></i><i style="top: 144px; width: 14px"></i><i style="top: 168px; width: 8px"></i><i style="top: 192px; width: 14px"></i><i style="top: 216px; width: 8px"></i><i style="top: 240px; width: 14px"></i><i style="top: 264px; width: 8px"></i><i style="top: 288px; width: 14px"></i></div>
<div style="position: absolute; left: 22px; right: 22px; bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; animation: ghost 3s ease-in-out infinite">
<span style="font-size: 15px" class="dim">LAST 80×8</span>
<span style="position: relative; width: 120px; height: 34px"><i style="position: absolute; left: 0; right: 0; top: 15px; height: 4px; background: #7A3E1C"></i><i class="plate" style="left: 30px; top: 0; width: 10px; height: 34px"></i><i class="plate" style="left: 42px; top: 5px; width: 8px; height: 24px; opacity: .8"></i><i class="plate" style="left: 52px; top: 10px; width: 5px; height: 14px; opacity: .6"></i></span>
</div>
</div>
<div class="flip" style="left: 26px; top: 606px; height: 72px; font-size: 40px; line-height: 72px">2</div>
<div style="position: absolute; left: 26px; top: 684px; width: 60px; text-align: center; font-size: 13px; font-weight: 800; color: #7C7A73">of 3</div>
<div class="ring" style="left: 110px; top: 590px; width: 170px; height: 170px"></div>
<button class="shut" style="left: 122px; top: 600px; width: 146px; height: 146px; font-size: 24px">Log</button>
<div class="jog" style="right: 22px; top: 588px; width: 64px; height: 180px; animation: vroll 1.6s ease-in-out infinite alternate"></div>
<div style="position: absolute; right: 22px; top: 774px; width: 64px; text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #7C7A73">KG</div>
</div>
</body></html>
