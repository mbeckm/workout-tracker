<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A6 Weigh-in on the wheel</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.card{background:#FBFAF7;border-radius:28px;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(60,50,30,.12),0 1px 2px rgba(60,50,30,.1)}
.mut{color:#8E8B83}
.dock{border-radius:40px 40px 0 0;box-shadow:0 -1px 0 #fff,0 -12px 30px rgba(60,50,30,.16)}
.jog{border-radius:30px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 14px 16px rgba(0,0,0,.2),inset 0 -14px 16px rgba(0,0,0,.2),0 3px 0 #A9A69E}
@keyframes swing{0%{transform:rotate(-40deg)}60%{transform:rotate(8deg)}80%{transform:rotate(2deg)}100%{transform:rotate(4deg)}}
@keyframes roll{from{background-position:0 0}to{background-position:0 28px}}
</style>
</head><body style="margin:0">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F2EE; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px">
<div class="mut" style="font-size: 15px; font-weight: 800">Body weight</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -0.6px">Down 0.8 kg in 8 weeks</div>
</div>
<div class="card" style="position: absolute; top: 148px; left: 16px; right: 16px; height: 190px; padding: 18px 20px; box-sizing: border-box">
<svg width="318" height="120" viewBox="0 0 318 120" style="position: absolute; left: 20px; bottom: 20px">
<g fill="#D9D6CF"><circle cx="10" cy="40" r="5"></circle><circle cx="50" cy="34" r="5"></circle><circle cx="90" cy="48" r="5"></circle><circle cx="130" cy="44" r="5"></circle><circle cx="170" cy="60" r="5"></circle><circle cx="210" cy="56" r="5"></circle><circle cx="250" cy="70" r="5"></circle></g>
<path d="M10 38 C90 44 170 56 290 74" fill="none" stroke="#2A2925" stroke-width="3" stroke-linecap="round"></path>
<circle cx="296" cy="76" r="8" fill="#F2550F"></circle>
</svg>
<div class="mut" style="font-size: 14px; font-weight: 800">Aug</div>
<div class="mut" style="position: absolute; right: 20px; top: 18px; font-size: 14px; font-weight: 800; color: #C2410C">Today</div>
</div>
<div class="alu dock" style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px">
<div class="disp" style="position: absolute; top: 24px; left: 16px; right: 96px; height: 196px; border-radius: 120px 120px 24px 24px">
<svg width="278" height="160" viewBox="0 0 278 160" style="position: absolute; left: 0; top: 10px">
<path d="M34 140 A105 105 0 0 1 244 140" fill="none" stroke="#3A2214" stroke-width="2"></path>
<g stroke="#7A3E1C" stroke-width="2"><line x1="139" y1="30" x2="139" y2="44"></line><line x1="65" y1="61" x2="74" y2="71"></line><line x1="213" y1="61" x2="204" y2="71"></line><line x1="36" y1="140" x2="50" y2="140"></line><line x1="242" y1="140" x2="228" y2="140"></line></g>
<g style="transform-origin: 139px 140px; animation: swing 1.6s cubic-bezier(.2,.8,.3,1) forwards"><line x1="139" y1="140" x2="139" y2="46" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" style="filter: drop-shadow(0 0 4px #FF6A1A)"></line></g>
<circle cx="139" cy="140" r="8" fill="#FF6A1A"></circle>
</svg>
<div class="dim" style="position: absolute; left: 26px; bottom: 12px; font-size: 13px">80</div>
<div class="dim" style="position: absolute; right: 26px; bottom: 12px; font-size: 13px">83</div>
</div>
<div class="jog" style="position: absolute; top: 24px; right: 16px; width: 68px; height: 196px; animation: roll 1.6s ease-in-out infinite alternate"></div>
<div style="position: absolute; top: 240px; left: 20px"><span class="lab">TODAY</span></div>
<div class="disp" style="position: absolute; top: 260px; left: 16px; right: 16px; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; box-sizing: border-box"><span style="font-size: 44px">81.4<span style="font-size: 18px"> KG</span></span><span class="dim" style="font-size: 16px">−0.3 WK</span></div>
<button class="go" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 84px; font-size: 22px">Save 81.4 kg</button>
</div>
</div>
</body></html>
