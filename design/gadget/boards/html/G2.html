<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G2 Friendly card above</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.key{border-radius:18px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.08);font-weight:800;color:#2A2925}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.jog{border-radius:30px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 14px 16px rgba(0,0,0,.2),inset 0 -14px 16px rgba(0,0,0,.2),0 3px 0 #A9A69E}
.card{background:#FBFAF7;border-radius:28px;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(60,50,30,.12),0 1px 2px rgba(60,50,30,.1)}
.mut{color:#8E8B83}
.fade{position:absolute;left:0;right:0;height:56px;z-index:1}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#EFEDE8;font-size:14px;font-weight:800}
.up{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #ECEAE4;font-size:16px;font-weight:700}
@keyframes roll{from{background-position:0 0}to{background-position:0 28px}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div class="card" style="position: absolute; top: 56px; left: 16px; right: 16px; padding: 20px 20px 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span class="mut" style="font-size: 15px; font-weight: 800">Push 1, set 2 of 3</span><span class="pill">12:04</span></div>
<div style="margin-top: 6px; font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -0.5px">Bench Press</div>
<div style="margin-top: 10px; display: flex; gap: 6px"><span class="pill" style="background: #FFE7D9; color: #C2410C">Last time 80 × 8</span><span class="pill">Best 82.5 × 6</span></div>
<div style="margin-top: 14px">
<div class="up"><span>Cable Fly</span><span class="mut">3 × 12</span></div>
<div class="up"><span>Overhead Press</span><span class="mut">3 × 8</span></div>
</div>
</div>
<div style="position: absolute; top: 334px; left: 20px; right: 20px; display: flex; justify-content: space-between"><span class="lab">WEIGHT</span><span class="lab">KG</span></div>
<div style="position: absolute; top: 354px; left: 16px; right: 16px; display: flex; gap: 10px">
<div class="disp" style="flex-grow: 1; height: 196px">
<div class="fade" style="top: 0; background: linear-gradient(180deg, #121211, rgba(18,18,17,0))"></div>
<div class="fade" style="bottom: 0; background: linear-gradient(0deg, #121211, rgba(18,18,17,0))"></div>
<div class="dim" style="position: absolute; left: 22px; top: 12px; font-size: 34px">87.5</div>
<div style="position: absolute; left: 22px; top: 66px; font-size: 64px; line-height: 64px">85.0</div>
<div class="dim" style="position: absolute; left: 22px; top: 146px; font-size: 34px">82.5</div>
<div style="position: absolute; left: 10px; right: 10px; top: 60px; height: 76px; border-radius: 16px; box-shadow: inset 0 0 0 2px #FF6A1A"></div>
</div>
<div class="jog" style="width: 68px; height: 196px; animation: roll 1.6s ease-in-out infinite alternate"></div>
</div>
<div style="position: absolute; top: 566px; left: 20px"><span class="lab">REPS</span></div>
<div style="position: absolute; top: 586px; left: 16px; right: 16px; display: flex; gap: 10px">
<div class="disp" style="flex-grow: 1; height: 64px; display: flex; align-items: center; padding: 0 22px; font-size: 40px">8</div>
<button class="key" style="width: 68px; height: 64px; font-size: 24px" aria-label="Fewer reps">−</button>
<button class="key" style="width: 68px; height: 64px; font-size: 24px" aria-label="More reps">+</button>
</div>
<button class="go" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 84px; font-size: 22px">Log 85 × 8</button>
</div>
</body></html>
