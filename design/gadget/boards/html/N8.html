<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rank moment</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:linear-gradient(180deg,#151514,#0C0C0B);color:#F3F2EE;box-shadow:0 -10px 30px rgba(0,0,0,.35);overflow:hidden}
.sm{color:#8C8A84}
.medal{position:absolute;left:50%;top:190px;margin-left:-110px;width:220px;height:220px;border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 3deg,#E8E4DB 3deg 6deg);box-shadow:0 10px 0 #6E6B64,0 30px 50px rgba(0,0,0,.6);animation:spin 1.6s cubic-bezier(.2,.8,.3,1)}
.face{position:absolute;inset:22px;border-radius:50%;background:#121211;box-shadow:inset 0 4px 12px rgba(0,0,0,.9),0 0 0 3px #CFCBC3}
@keyframes spin{from{transform:rotate(-200deg) scale(.6);opacity:0}}
@keyframes fill{from{stroke-dashoffset:465}}
@keyframes sp{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.spark{position:absolute;width:10px;height:10px;background:#FF6A1A;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:sp 2s ease-in-out infinite}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; inset: 0; background: rgba(20,18,15,.45)"></div>
<div class="sheet" style="top: 60px">
<div style="position: absolute; left: 24px; right: 24px; top: 56px; text-align: center"><div style="font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -.5px">New rank on bench</div><div class="sm" style="margin-top: 8px; font-size: 16px; font-weight: 600">92.5 kg puts you ahead of 64% of lifters who weigh 80 to 85 kg.</div></div>
<div class="medal"><div class="face">
<svg width="176" height="176" viewBox="0 0 176 176" style="position: absolute; left: 0; top: 0"><circle cx="88" cy="88" r="74" fill="none" stroke="#3A2214" stroke-width="10"></circle><circle cx="88" cy="88" r="74" fill="none" stroke="#FF6A1A" stroke-width="10" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="167" transform="rotate(-90 88 88)" style="animation: fill 1.8s .4s cubic-bezier(.2,.8,.3,1) backwards; filter: drop-shadow(0 0 6px #FF6A1A)"></circle></svg>
<div style="position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-family: 'Doto', monospace; font-weight: 900; color: #FF6A1A; font-size: 48px; line-height: 48px">64%</div>
<div style="position: absolute; left: 0; right: 0; top: 110px; text-align: center; font-family: 'Doto', monospace; font-weight: 900; color: #7A3E1C; font-size: 13px">WAS 57%</div>
</div></div>
<i class="spark" style="left: 70px; top: 200px"></i><i class="spark" style="left: 310px; top: 250px; animation-delay: .6s"></i><i class="spark" style="left: 96px; top: 410px; animation-delay: 1.1s"></i>
<div style="position: absolute; left: 16px; right: 16px; top: 470px; display: flex; gap: 8px">
<div style="flex: 1; background: #232321; border-radius: 20px; padding: 14px 16px"><div class="sm" style="font-size: 13px; font-weight: 700">Next rank</div><div style="font-size: 20px; font-weight: 800; margin-top: 2px">75% at 100 kg</div></div>
<div style="flex: 1; background: #232321; border-radius: 20px; padding: 14px 16px"><div class="sm" style="font-size: 13px; font-weight: 700">At your pace</div><div style="font-size: 20px; font-weight: 800; margin-top: 2px">~9 weeks</div></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; gap: 12px; justify-content: center">
<button style="width: 150px; height: 56px; border-radius: 28px; background: #2E2D2A; font-size: 18px; font-weight: 800">Close</button>
<button style="width: 150px; height: 56px; border-radius: 28px; background: #FF6A1A; color: #1C0E05; font-size: 18px; font-weight: 800">Share</button>
</div>
</div>
</div>
</body></html>
