<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>X3 Settings as a panel</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:18px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);position:absolute;white-space:nowrap}
.card{background:#FBFAF7;border-radius:24px;box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(60,50,30,.10),0 1px 2px rgba(60,50,30,.1)}
.mut{color:#8E8B83}
.row{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid #ECEAE4;font-size:17px;font-weight:700}
.row:first-child{border-top:0}
.sw{position:absolute;width:150px;height:52px;border-radius:26px;background:#2A2925;box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 #fff}
.sw .t{position:absolute;top:4px;width:72px;height:44px;border-radius:22px;background:linear-gradient(180deg,#F4F3EF,#D9D6CF);box-shadow:0 2px 0 #8E8B83,inset 0 1px 0 #fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sw .o{position:absolute;top:0;height:52px;width:75px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#8E8B83}
.knob{border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 2deg,#E4E0D7 2deg 4deg);box-shadow:0 5px 0 #A9A69E,0 12px 20px rgba(0,0,0,.18);position:absolute}
.cap{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FAF9F6,#D9D6CF);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.15)}
.ptr{position:absolute;left:50%;top:5px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:#FF6A1A}
.tog{position:absolute;width:64px;height:96px;border-radius:18px;background:#2A2925;box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 #fff}
.tog i{position:absolute;left:6px;right:6px;height:48px;border-radius:14px;background:linear-gradient(180deg,#F4F3EF,#D9D6CF);box-shadow:0 3px 0 #8E8B83,inset 0 1px 0 #fff}
.tog b{position:absolute;left:50%;top:-14px;width:8px;height:8px;margin-left:-4px;border-radius:4px;background:#3A2214}
.sk{position:absolute;width:52px;height:52px;border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 rgba(0,0,0,.2)}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -0.6px">Settings</div>
<span class="lab" style="left: 22px; top: 130px">UNITS</span>
<div class="sw" style="left: 16px; top: 152px"><span class="o" style="left: 0">KG</span><span class="o" style="right: 0">LB</span><span class="t" style="left: 4px">KG</span></div>
<span class="lab" style="left: 196px; top: 130px">REST</span>
<div class="knob" style="left: 192px; top: 150px; width: 76px; height: 76px"><div class="cap" style="transform: rotate(20deg)"><div class="ptr"></div></div></div>
<div class="disp" style="left: 280px; top: 158px; width: 94px; height: 58px; display: flex; align-items: center; justify-content: center; font-size: 28px">2:00</div>
<span class="lab" style="left: 22px; top: 252px">SOUND</span>
<span class="lab" style="left: 106px; top: 252px">HAPTICS</span>
<span class="lab" style="left: 192px; top: 252px">LIVE ACT.</span>
<div class="tog" style="left: 16px; top: 286px"><b style="background: #FF6A1A; box-shadow: 0 0 6px #FF6A1A"></b><i style="top: 6px"></i></div>
<div class="tog" style="left: 102px; top: 286px"><b style="background: #FF6A1A; box-shadow: 0 0 6px #FF6A1A"></b><i style="top: 6px"></i></div>
<div class="tog" style="left: 188px; top: 286px"><b></b><i style="bottom: 6px"></i></div>
<span class="lab" style="left: 22px; top: 410px">FINISH</span>
<div class="sk" style="left: 16px; top: 432px; background: linear-gradient(180deg, #ECEAE4, #CFCCC5); box-shadow: 0 0 0 3px #F2550F, inset 0 1px 0 #fff"></div>
<div class="sk" style="left: 80px; top: 432px; background: linear-gradient(180deg, #4A4842, #2A2925)"></div>
<div class="sk" style="left: 144px; top: 432px; background: linear-gradient(180deg, #F7E3C8, #E2C49E)"></div>
<div class="sk" style="left: 208px; top: 432px; background: linear-gradient(180deg, #8FA6BF, #5E7590)"></div>
<div class="sk" style="left: 272px; top: 432px; background: linear-gradient(180deg, #F25A2A, #C93A10)"></div>
<div class="card" style="position: absolute; left: 16px; right: 16px; top: 520px; padding: 6px 20px">
<div class="row"><span>Trim Pro</span><span class="mut">Active</span></div>
<div class="row"><span>Restore purchases</span><span class="mut">›</span></div>
<div class="row"><span>Body check-ins</span><span class="mut">›</span></div>
<div class="row"><span>Support</span><span class="mut">›</span></div>
<div class="row"><span>Privacy</span><span class="mut">›</span></div>
</div>
</div>
</body></html>
