<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G1 Gadget only</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:relative;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.key{border-radius:18px;background:linear-gradient(180deg,#F4F3EF,#E1DFD9);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.08);font-weight:800;color:#2A2925}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.jog{border-radius:30px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 14px 16px rgba(0,0,0,.2),inset 0 -14px 16px rgba(0,0,0,.2),0 3px 0 #A9A69E}
.led{width:30px;height:6px;border-radius:3px;background:#3A2214}
.on{background:#FF6A1A;box-shadow:0 0 8px #FF6A1A}
.fade{position:absolute;left:0;right:0;height:70px;z-index:1}
@keyframes roll{from{background-position:0 0}to{background-position:0 28px}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div class="disp" style="position: absolute; top: 56px; left: 16px; right: 16px; height: 196px; padding: 18px 20px; box-sizing: border-box">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 15px"><span>PUSH 1</span><span>12:04</span></div>
<div style="margin-top: 14px; font-size: 36px; line-height: 38px">BENCH PRESS</div>
<div style="margin-top: 12px; display: flex; align-items: center; gap: 6px"><span class="led on"></span><span class="led on" style="opacity: .55"></span><span class="led"></span><span style="margin-left: 8px; font-size: 16px">SET 2 OF 3</span></div>
<div class="dim" style="position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; justify-content: space-between; font-size: 14px"><span>LAST 80×8</span><span>NEXT CABLE FLY</span></div>
</div>
<div style="position: absolute; top: 270px; left: 20px; right: 20px; display: flex; justify-content: space-between"><span class="lab">WEIGHT</span><span class="lab">KG</span></div>
<div style="position: absolute; top: 292px; left: 16px; right: 16px; display: flex; gap: 10px">
<div class="disp" style="flex-grow: 1; height: 232px">
<div class="fade" style="top: 0; background: linear-gradient(180deg, #121211, rgba(18,18,17,0))"></div>
<div class="fade" style="bottom: 0; background: linear-gradient(0deg, #121211, rgba(18,18,17,0))"></div>
<div class="dim" style="position: absolute; left: 22px; top: 18px; font-size: 38px">87.5</div>
<div style="position: absolute; left: 22px; top: 82px; font-size: 68px; line-height: 68px">85.0</div>
<div class="dim" style="position: absolute; left: 22px; top: 170px; font-size: 38px">82.5</div>
<div style="position: absolute; left: 10px; right: 10px; top: 76px; height: 80px; border-radius: 16px; box-shadow: inset 0 0 0 2px #FF6A1A"></div>
</div>
<div class="jog" style="width: 68px; height: 232px; animation: roll 1.6s ease-in-out infinite alternate"></div>
</div>
<div style="position: absolute; top: 542px; left: 20px"><span class="lab">REPS</span></div>
<div style="position: absolute; top: 564px; left: 16px; right: 16px; display: flex; gap: 10px">
<div class="disp" style="flex-grow: 1; height: 64px; display: flex; align-items: center; padding: 0 22px; font-size: 40px">8</div>
<button class="key" style="width: 68px; height: 64px; font-size: 24px" aria-label="Fewer reps">−</button>
<button class="key" style="width: 68px; height: 64px; font-size: 24px" aria-label="More reps">+</button>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 10px">
<button class="key" style="width: 78px; height: 84px; font-size: 13px; line-height: 16px">Swap<br>lift</button>
<button class="go" style="flex-grow: 1; height: 84px; font-size: 22px">Log 85 × 8</button>
</div>
</div>
</body></html>
