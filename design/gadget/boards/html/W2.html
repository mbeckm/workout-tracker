<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>W2 Receipts pile up on a rail</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{position:absolute;border-radius:28px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;overflow:hidden;box-sizing:border-box}
.dim{color:#7A3E1C}
.rk{position:absolute;width:56px;height:56px;border-radius:28px;background:linear-gradient(180deg,#F4F3EF,#DEDBD4);box-shadow:inset 0 1px 0 #fff,0 3px 0 #A9A69E,0 6px 10px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;color:#2A2925;font-weight:800}
.jog{position:absolute;border-radius:24px;background:repeating-linear-gradient(180deg,#F2F1ED 0 5px,#C4C1B9 5px 7px);box-shadow:inset 0 16px 16px rgba(0,0,0,.22),inset 0 -16px 16px rgba(0,0,0,.22),0 3px 0 #A9A69E}
.big{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 22%,#FF8A45,#F2550F 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(150,40,0,.25),0 6px 0 #B83A05,0 16px 26px rgba(200,70,10,.3);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.well{position:absolute;border-radius:50%;background:#C4C1B9;box-shadow:inset 0 4px 10px rgba(0,0,0,.28),0 1px 0 #fff}
.rail{position:absolute;left:16px;right:16px;top:128px;height:10px;border-radius:5px;background:linear-gradient(180deg,#B9B6AE,#8E8A80);box-shadow:0 2px 0 #fff inset,0 2px 4px rgba(0,0,0,.2)}
.slip{position:absolute;top:132px;width:82px;filter:drop-shadow(0 6px 8px rgba(60,50,30,.22))}
.slip .p{background:#FBF8F1;font-family:'IBM Plex Mono',monospace;font-size:9px;line-height:13px;color:#3A3833;padding:16px 8px 12px;clip-path:polygon(0 0,100% 0,100% 94%,90% 100%,80% 94%,70% 100%,60% 94%,50% 100%,40% 94%,30% 100%,20% 94%,10% 100%,0 94%)}
.slip .p b{display:block;font-size:11px;font-weight:700;color:#1C1B18}
.clip{position:absolute;left:50%;top:-6px;margin-left:-12px;width:24px;height:16px;border-radius:4px;background:linear-gradient(180deg,#F4F3EF,#B9B6AE);box-shadow:0 2px 3px rgba(0,0,0,.25);z-index:1}
.empty{position:absolute;top:142px;width:82px;height:86px;border-radius:8px;border:2px dashed rgba(124,122,115,.45)}
.lab{position:absolute;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);white-space:nowrap;text-align:center}
@keyframes sway{50%{transform:rotate(-2deg)}}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<button class="rk" style="left: 20px; top: 56px" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 22 22"><g stroke="#2A2925" stroke-width="2.6" stroke-linecap="round"><line x1="3" y1="6" x2="19" y2="6"></line><line x1="3" y1="16" x2="19" y2="16"></line></g><circle cx="8" cy="6" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle><circle cx="14" cy="16" r="3" fill="#F4F3EF" stroke="#2A2925" stroke-width="2.4"></circle></svg></button>
<div class="lab" style="left: 100px; top: 70px; width: 190px; font-size: 13px; letter-spacing: 2px">WEEK 12</div>
<button class="rk" style="right: 20px; top: 56px" aria-label="History"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="#2A2925" stroke-width="2.4"></circle><path d="M11 6 V11 L14.5 13" fill="none" stroke="#2A2925" stroke-width="2.4" stroke-linecap="round"></path></svg></button>
<div class="rail"></div>
<div class="slip" style="left: 24px; transform-origin: 50% 0; transform: rotate(3deg)"><i class="clip"></i><div class="p"><b>PULL 1</b>MON 29 SEP<br>9 SETS<br>8,960 KG<br>48 MIN</div></div>
<div class="slip" style="left: 114px; transform-origin: 50% 0; transform: rotate(-2deg); animation: sway 3s ease-in-out infinite"><i class="clip"></i><div class="p"><b>LEGS 1</b>TUE 30 SEP<br>9 SETS<br>11,240 KG<br><span style="color: #C2410C; font-weight: 700">SQUAT PR</span></div></div>
<div class="empty" style="left: 204px; border-color: #F2550F"></div>
<div class="empty" style="left: 294px"></div>
<div class="lab" style="left: 204px; top: 238px; width: 82px; color: #C2410C">PUSH 1</div>
<div class="lab" style="left: 294px; top: 238px; width: 82px">LEGS 2</div>
<div class="disp" style="top: 270px; left: 20px; right: 20px; height: 290px; padding: 20px 22px">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 15px"><span>NEXT</span><span>~45 MIN</span></div>
<div style="margin-top: 10px; font-size: 46px; line-height: 48px">PUSH 1</div>
<div style="margin-top: 16px; font-size: 16px; line-height: 27px">BENCH PRESS<span class="dim"> 3×8</span><br>CABLE FLY<span class="dim"> 3×12</span><br>OVERHEAD PRESS<span class="dim"> 3×8</span><br><span class="dim">+3 MORE</span></div>
</div>
<button class="rk" style="left: 22px; top: 592px; width: 64px; height: 76px; border-radius: 22px; font-size: 22px" aria-label="Previous day">‹</button>
<button class="rk" style="left: 22px; top: 680px; width: 64px; height: 76px; border-radius: 22px; font-size: 22px" aria-label="Next day">›</button>
<div class="well" style="left: 110px; top: 590px; width: 170px; height: 170px"></div>
<button class="big" style="left: 122px; top: 600px; width: 146px; height: 146px; font-size: 22px">Start</button>
<div class="jog" style="right: 22px; top: 588px; width: 64px; height: 180px"></div>
</div>
</body></html>
