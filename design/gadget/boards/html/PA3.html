<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PA3 A: add lifts sheet</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>
<style>
body{margin:0}button{font:inherit;color:inherit;border:0;background:none;padding:0}.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),linear-gradient(180deg,#E4E2DC,#D2CFC8)}.scrim{position:absolute;inset:0;background:rgba(20,18,15,.4)}.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:38px 38px 0 0;background:#151514;color:#F3F2EE;overflow:hidden}.st{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:18px;font-weight:800}.ck{position:absolute;top:14px;height:40px;min-width:40px;padding:0 14px;box-sizing:border-box;border-radius:20px;background:#262624;display:flex;align-items:center;justify-content:center;color:#C9C6BF;font-size:16px;font-weight:800}.dc{position:absolute;left:12px;right:12px;background:#232321;border-radius:24px;overflow:hidden}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #2E2E2B;font-size:16px;font-weight:700}.row:first-child{border-top:0}.row .s{display:block;font-size:13px;font-weight:600;color:#8C8A84;margin-top:2px}.pill{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:16px;background:#2E2D2A;font-size:14px;font-weight:800;color:#D9D6CF;flex-shrink:0}.pill.on{background:#FF6A1A;color:#1C0E05}.cta{position:absolute;left:16px;right:16px;bottom:34px;height:60px;border-radius:30px;background:#FBFAF7;color:#1C1B18;font-size:18px;font-weight:800}
.tick{width:30px;height:30px;border-radius:15px;box-shadow:inset 0 0 0 2px #4A4945;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.tick.on{background:#FF6A1A;box-shadow:none;color:#1C0E05}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: ui-rounded, -apple-system, sans-serif">
<div class="scrim"></div>
<div class="sheet" style="top: 60px">
<button class="ck" style="left: 16px">✕</button>
<div class="st">Add to Push 1</div>
<div style="position: absolute; left: 16px; right: 16px; top: 72px; height: 46px; border-radius: 23px; background: #232321; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 700; color: #8C8A84">⌕  Search 200 exercises</div>
<div style="position: absolute; left: 16px; right: 0; top: 132px; display: flex; gap: 8px; overflow: hidden"><span class="pill">All</span><span class="pill on">Chest</span><span class="pill">Shoulders</span><span class="pill">Triceps</span><span class="pill">Back</span></div>
<div class="dc" style="top: 182px">
<div class="row"><div>Incline Dumbbell Press<span class="s">Dumbbell, chest</span></div><span class="tick on">✓</span></div>
<div class="row"><div>Dips<span class="s">Bodyweight, chest</span></div><span class="tick on">✓</span></div>
<div class="row"><div>Machine Chest Press<span class="s">Machine, chest</span></div><span class="tick"></span></div>
<div class="row"><div>Pec Deck<span class="s">Machine, chest</span></div><span class="tick"></span></div>
<div class="row"><div>Push-up<span class="s">Bodyweight, chest</span></div><span class="tick"></span></div>
<div class="row"><div>Decline Bench Press<span class="s">Barbell, chest</span></div><span class="tick"></span></div>
<div class="row"><div>Landmine Press<span class="s">Barbell, chest</span></div><span class="tick"></span></div>
</div>
<button class="cta">Add 2 lifts</button>
</div>
</div>
</body></html>
