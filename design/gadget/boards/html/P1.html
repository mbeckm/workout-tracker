<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>P1 Pick a split with a selector</title><style>
@font-face{font-family:'Doto';font-weight:900;src:url('../../fonts/Doto-Black.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('../../fonts/IBMPlexMono-Medium.ttf') format('truetype')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url('../../fonts/IBMPlexMono-Bold.ttf') format('truetype')}
</style>


<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
.alu{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.02) 1px 3px),linear-gradient(180deg,#E4E2DC,#D2CFC8)}
.disp{border-radius:24px;background:#121211;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.7);color:#FF6A1A;font-family:'Doto',monospace;font-weight:900;position:absolute;overflow:hidden}
.dim{color:#7A3E1C}
.lab{font-size:12px;font-weight:800;letter-spacing:1px;color:#7C7A73;text-shadow:0 1px 0 rgba(255,255,255,.7);position:absolute;white-space:nowrap}
.go{border-radius:26px;background:radial-gradient(ellipse at 50% 15%,#FF8A45,#F2550F 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #B83A05,0 12px 20px rgba(200,70,10,.25);color:#fff;font-weight:800}
.knob{border-radius:50%;background:repeating-conic-gradient(#BDB8AD 0 2deg,#E4E0D7 2deg 4deg);box-shadow:0 6px 0 #A9A69E,0 14px 24px rgba(0,0,0,.2);position:absolute}
.cap{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#FAF9F6,#D9D6CF);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.15)}
.ptr{position:absolute;left:50%;top:7px;width:6px;height:26px;margin-left:-3px;border-radius:3px;background:#FF6A1A}
.thumb{border-radius:22px;background:repeating-linear-gradient(180deg,#F2F1ED 0 4px,#C4C1B9 4px 6px);box-shadow:inset 0 10px 10px rgba(0,0,0,.18),inset 0 -10px 10px rgba(0,0,0,.18),0 3px 0 #A9A69E;position:absolute}
.day{flex-grow:1;border-radius:10px;padding:8px;font-size:13px;line-height:17px;background:#2A1A10}
</style>
</head><body style="margin:0">
<div class="alu" style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #1C1B18; font-family: ui-rounded, -apple-system, sans-serif">
<div style="position: absolute; top: 62px; left: 24px; right: 24px">
<div style="font-size: 15px; font-weight: 800; color: #7C7A73">New plan, step 1 of 3</div>
<div style="font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.5px">How do you split it?</div>
</div>
<div class="disp" style="top: 146px; left: 16px; right: 16px; height: 200px; padding: 16px 18px; box-sizing: border-box">
<div class="dim" style="display: flex; justify-content: space-between; font-size: 14px"><span>SPLIT</span><span>4 DAYS A WEEK</span></div>
<div style="font-size: 32px; margin-top: 6px">UPPER LOWER</div>
<div style="display: flex; gap: 6px; margin-top: 18px">
<div class="day">UPPER A<br><span class="dim">CHEST BACK</span></div>
<div class="day">LOWER A<br><span class="dim">SQUAT</span></div>
<div class="day">UPPER B<br><span class="dim">SHLD ARMS</span></div>
<div class="day">LOWER B<br><span class="dim">HINGE</span></div>
</div>
</div>
<div style="position: absolute; top: 370px; left: 0; width: 390px; height: 300px">
<span class="lab" style="left: 22px; top: 6px">FULL BODY</span>
<span class="lab" style="left: 22px; top: 238px">CUSTOM</span>
<span class="lab" style="left: 128px; top: 6px; color: #C2410C">UPPER LOWER</span>
<span class="lab" style="left: 30px; top: 122px">BODY PART</span>
<span class="lab" style="left: 190px; top: 238px">PPL</span>
<div class="knob" style="left: 70px; top: 40px; width: 180px; height: 180px"><div class="cap" style="transform: rotate(10deg)"><div class="ptr"></div></div></div>
<span class="lab" style="left: 302px; top: 6px">DAYS</span>
<div class="disp" style="left: 292px; top: 30px; width: 80px; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 40px; border-radius: 18px">4</div>
<div class="thumb" style="left: 300px; top: 114px; width: 64px; height: 140px"></div>
</div>
<button class="go" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 84px; font-size: 22px">Next: fill the days</button>
</div>
</body></html>
